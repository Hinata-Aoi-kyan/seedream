name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'static/**'
      - 'manifest.json'
      - 'sw.js'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - 'signing/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write             # 首次提交签名密钥 / 失败回写日志 / 发 Release

env:
  LOG: /tmp/build.log

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 22 (Capacitor 8 要求 >=22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 固定签名密钥: 保证每次构建签名一致, 才能覆盖安装
      - name: 准备签名密钥
        run: |
          set -o pipefail
          {
            if [ -f signing/seedream.jks ]; then
              echo "已存在签名密钥, 复用"
            else
              mkdir -p signing
              keytool -genkeypair -v \
                -keystore signing/seedream.jks \
                -alias seedream -keyalg RSA -keysize 2048 -validity 10950 \
                -storepass seedream -keypass seedream \
                -dname "CN=Seedream, OU=Personal, O=Personal, L=CN, ST=CN, C=CN"
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add -f signing/seedream.jks
              git commit -m "ci: 生成固定签名密钥 [skip ci]"
              git push || echo "推送失败(可能并发), 本次仍用本地生成的密钥"
            fi
            keytool -list -keystore signing/seedream.jks -storepass seedream | head -5
          } 2>&1 | tee -a "$LOG" >&2

      - name: 检查环境
        run: |
          set -o pipefail
          {
            echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
            SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            ls "$SDK/platforms" 2>/dev/null | tail -3 || true
            java -version 2>&1 | head -2
          } 2>&1 | tee -a "$LOG" >&2

      - name: 安装依赖
        run: |
          set -o pipefail
          {
            npm install --no-audit --no-fund \
              @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest \
              @capacitor/filesystem@latest @capacitor/local-notifications@latest @capacitor/app@latest \
              @capacitor-community/media@latest
            npx cap --version
          } 2>&1 | tee -a "$LOG" >&2

      - name: 收集网页文件到 www/
        env:
          BUILD_VERSION: ${{ github.run_number }}
        run: |
          set -o pipefail
          node scripts/prepare-www.mjs 2>&1 | tee -a "$LOG" >&2

      - name: 生成 Android 工程
        run: |
          set -o pipefail
          npx cap add android 2>&1 | tee -a "$LOG" >&2

      - name: 打补丁(权限/明文/应用名/版本号/签名)
        env:
          BUILD_VERSION: ${{ github.run_number }}
          BUILD_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          node scripts/patch-android.mjs 2>&1 | tee -a "$LOG" >&2

      - name: 同步 web 资源
        run: |
          set -o pipefail
          npx cap sync android 2>&1 | tee -a "$LOG" >&2

      - name: 编译 APK
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          { ./gradlew assembleDebug --no-daemon --stacktrace; } 2>&1 | tee -a /tmp/build.log

      - name: 重命名产物(带版本号)
        id: apk
        run: |
          SRC=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          OUT="Seedream-1.0.${{ github.run_number }}.apk"
          cp "$SRC" "/tmp/$OUT"
          echo "file=/tmp/$OUT" >> "$GITHUB_OUTPUT"
          echo "name=$OUT" >> "$GITHUB_OUTPUT"
          ls -la "/tmp/$OUT"
          sha256sum "/tmp/$OUT"

      # ---------- 成功: 发 Release (带版本号的标签, 下载 URL 唯一, 避开 CDN 缓存) ----------
      - name: 发布 Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Seedream v1.0.${{ github.run_number }}"
          body: |
            **版本** v1.0.${{ github.run_number }}
            - 提交: `${{ github.sha }}`
            - 构建时间: ${{ github.event.head_commit.timestamp }}
            - 签名: 固定密钥（可直接覆盖安装，无需卸载）

            下载下面的 APK 安装即可。
          files: ${{ steps.apk.outputs.file }}
          fail_on_unmatched_files: true

      # ---------- 失败: 回写日志 ----------
      - name: 回写失败日志
        if: failure()
        run: |
          python3 - <<'PY'
          import json, os
          tail = ""
          try:
              with open("/tmp/build.log", "rb") as f:
                  tail = f.read()[-9000:].decode("utf-8", "replace")
          except Exception as e:
              tail = "无法读取日志: %s" % e
          data = {
              "status": "failure",
              "sha": os.environ.get("GITHUB_SHA", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_url": "https://github.com/%s/actions/runs/%s" % (
                  os.environ.get("GITHUB_REPOSITORY", ""), os.environ.get("GITHUB_RUN_ID", "")),
              "log_tail": tail,
          }
          os.makedirs(".ci", exist_ok=True)
          with open(".ci/status.json", "w") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print("已写入 .ci/status.json, 日志 %d 字符" % len(tail))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .ci/status.json
          git commit -m "ci: build failure [skip ci]" || true
          git push || true
