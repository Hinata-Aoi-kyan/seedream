name: Build Android APK

on:
  workflow_dispatch:          # 可手动触发
  push:
    paths:
      - 'index.html'
      - 'static/**'
      - 'manifest.json'
      - 'sw.js'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3

      - name: 接受 SDK 许可 + 预装组件
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" >/dev/null 2>&1 || true
          sdkmanager --install "build-tools;35.0.0" >/dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: 安装依赖
        run: |
          npm install --no-audit --no-fund \
            @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest \
            @capacitor/filesystem@latest @capacitor/local-notifications@latest @capacitor/app@latest
          npx cap --version

      - name: 收集网页文件到 www/
        run: node scripts/prepare-www.mjs

      - name: 生成 Android 工程
        run: npx cap add android

      - name: 打补丁(权限/明文/应用名)
        run: node scripts/patch-android.mjs

      - name: 同步 web 资源
        run: npx cap sync android

      - name: 编译 Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: seedream-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 构建失败时打印诊断
        if: failure()
        run: |
          echo "=== java ==="; java -version || true
          echo "=== manifest ==="; cat android/app/src/main/AndroidManifest.xml || true
          echo "=== gradle 日志尾部 ==="; tail -80 android/app/build/outputs/logs/* 2>/dev/null || true
