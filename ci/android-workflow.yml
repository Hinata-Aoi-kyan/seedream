name: Build Android APK

on:
  workflow_dispatch:          # 可手动触发
  push:
    paths:
      - 'index.html'
      - 'static/**'
      - 'manifest.json'
      - 'sw.js'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write             # 需要: 失败时回写日志 / 成功时发布 Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3

      - name: 接受 SDK 许可 + 预装组件
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" >/dev/null 2>&1 || true
          sdkmanager --install "build-tools;35.0.0" >/dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: 安装依赖
        run: |
          npm install --no-audit --no-fund \
            @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest \
            @capacitor/filesystem@latest @capacitor/local-notifications@latest @capacitor/app@latest
          npx cap --version

      - name: 收集网页文件到 www/
        run: node scripts/prepare-www.mjs

      - name: 生成 Android 工程
        run: npx cap add android

      - name: 打补丁(权限/明文/应用名)
        run: node scripts/patch-android.mjs

      - name: 同步 web 资源
        run: npx cap sync android

      - name: 编译 Debug APK
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      # ---------- 成功: 发布 Release (稳定下载链接) ----------
      - name: 发布 Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Seedream APK (自动构建)"
          body: |
            自动构建产物
            - commit: ${{ github.sha }}
            - 运行: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true

      # ---------- 失败: 把日志写回仓库, 便于外部排查 ----------
      - name: 回写失败日志
        if: failure()
        run: |
          python3 - <<'PY'
          import json, os
          tail = ""
          for p in ("/tmp/build.log",):
              try:
                  with open(p, "rb") as f:
                      tail = f.read()[-8000:].decode("utf-8", "replace")
              except Exception as e:
                  tail += "\n[%s] %s" % (p, e)
          data = {
              "status": "failure",
              "sha": os.environ.get("GITHUB_SHA", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_url": "https://github.com/%s/actions/runs/%s" % (
                  os.environ.get("GITHUB_REPOSITORY", ""), os.environ.get("GITHUB_RUN_ID", "")),
              "log_tail": tail,
          }
          os.makedirs(".ci", exist_ok=True)
          with open(".ci/status.json", "w") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print("已写入 .ci/status.json")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .ci/status.json
          git commit -m "ci: build failure [skip ci]" || true
          git push || true

      - name: 失败时控制台诊断
        if: failure()
        run: |
          echo "=== java ==="; java -version || true
          echo "=== manifest ==="; cat android/app/src/main/AndroidManifest.xml || true
          echo "=== 日志尾部 ==="; tail -60 /tmp/build.log || true
