<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Seedream Web</title>
<script>
/* 首屏防闪烁: 在样式前就按「跟随系统/浅色/深色」定好主题 */
(function(){ try{
  var m = localStorage.getItem('sw_theme_mode') || 'system';
  var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  var dark = (m==='dark') || (m==='system' && sysDark);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
}catch(e){} })();
</script>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0f1115;--card:#1a1d24;--card2:#22262f;--line:#2c313b;
    --txt:#e8ebf0;--mut:#9aa3b2;--acc:#4c8dff;--acc2:#6ee7b7;--bad:#ff6b6b;--deep:#141720;
  }
  :root[data-theme="light"]{
    color-scheme:light;
    --bg:#f4f5f8;--card:#ffffff;--card2:#f0f1f5;--line:#dde1e8;
    --txt:#1b1f27;--mut:#6a7280;--acc:#2563eb;--acc2:#0d9488;--bad:#dc2626;--deep:#ffffff;
  }
  *{box-sizing:border-box}
  :root{
    /* 安全区: 优先 Capacitor 8.3+ 注入的 --safe-area-inset-*(原生 WindowInsets 真实值);
       Android WebView <140 的 env() 有 bug 常返回 0, 所以最后由 JS 再兜一次 */
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
  }
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg)}
  body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--txt);-webkit-tap-highlight-color:transparent;
       transition:background .25s,color .25s}
  .app{display:flex;flex-direction:column;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);
         backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);
         padding:calc(12px + var(--sat)) 16px 12px}
  header h1{font-size:18px;margin:0;display:flex;align-items:center;gap:8px}
  header h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--acc2);display:inline-block}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;text-align:center;line-height:1;width:38px;height:38px;
        border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:10px;cursor:pointer}
  .icon-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;margin:auto}
  main{flex:1;padding:12px 14px calc(120px + var(--sab));width:100%;box-sizing:border-box;}
  .page{display:none}
  .page.active{display:block}
  .btn{border:1px solid var(--line);background:var(--card);color:var(--txt);padding:11px 11px;
       border-radius:10px;font-size:14px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:5px}
  .btn svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .btn.small svg{width:13px;height:13px}
  .prov-menu svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;margin:auto}
  .provmenu div{display:flex;align-items:center;gap:9px}
  .provmenu div svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .edtool{display:inline-flex;align-items:center;gap:5px}
  .edtool svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .chip .btn svg{width:12px;height:12px}
  .btn:hover{border-color:var(--acc)}
  .btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
  .btn.small{padding:6px 9px;font-size:12px;gap:4px}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--bad);padding:2px}
  .btn.ghost svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .btn:disabled{opacity:.55;cursor:not-allowed;pointer-events:none}
  .btn:disabled .spin{border-top-color:var(--acc)}
  .loader{width:22px;height:22px;border:3px solid color-mix(in srgb,var(--acc) 30%,transparent);border-top-color:var(--acc);border-radius:50%;animation:sp .9s linear infinite;flex:none;display:inline-block}
  @keyframes sp{to{transform:rotate(360deg)}}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 14px}
  label{display:block;font-size:12px;color:var(--mut);margin:10px 0 6px}
  input[type=text],input[type=password],textarea,select{width:100%;background:var(--card2);color:var(--txt);
       border:1px solid var(--line);border-radius:10px;padding:11px;font-size:15px;font-family:inherit}
  textarea{min-height:88px;resize:vertical}
  textarea::-webkit-resizer{background:transparent}
  textarea{scrollbar-width:thin}
  /* textarea 右下角拖拽手柄(简洁、可拖) */
  .ta-wrap{position:relative;display:block}
  .ta-wrap textarea{display:block;resize:vertical}
  .ta-grip{position:absolute;right:0;bottom:0;width:28px;height:28px;
        display:flex;align-items:flex-end;justify-content:flex-end;opacity:.45;transition:.15s;pointer-events:none;
        background:
          linear-gradient(135deg, transparent 50%, var(--line) 50%) 100% 100%/7px 7px no-repeat,
          linear-gradient(135deg, transparent 50%, var(--line) 50%) 100% 100%/11px 11px no-repeat;
        }
  .ta-wrap:hover .ta-grip{opacity:.8}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row > *{flex:1;min-width:140px}
  .toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
  .opt-sub{font-size:11px;color:var(--mut);line-height:1.35;margin-top:2px}
  .switch{position:relative;width:50px;height:28px;flex:none}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:var(--line);border-radius:20px;cursor:pointer;transition:.2s}
  .slider:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
  .switch input:checked + .slider{background:var(--acc2)}
  .switch input:checked + .slider:before{transform:translateX(22px)}
  .refs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .ref{position:relative;width:74px;height:74px;border-radius:10px;overflow:hidden;border:1px solid var(--line);
       user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
  .ref img{width:100%;height:100%;object-fit:cover;cursor:pointer;pointer-events:none}
  .ref .del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);border:none;color:#fff;
        width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:15px;padding:0;line-height:1;
        display:flex;align-items:center;justify-content:center}
  .ref .del:hover{background:rgba(0,0,0,.85)}
  .ref .idx{position:absolute;left:2px;bottom:2px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:1px 5px;border-radius:6px}
  .ref{display:flex;flex-direction:column;width:96px;height:auto;border:1px solid var(--line);border-radius:8px;padding:4px}
  .ref .thumb{position:relative;width:100%;height:88px;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--card2)}
  .ref .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .ref .thumb .idx{position:absolute;left:3px;bottom:3px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:1px 5px;border-radius:6px}
  .ref .thumb .del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);border:none;color:#fff;width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:15px;padding:0;line-height:1;display:flex;align-items:center;justify-content:center}
  .ref select.refrole{margin-top:4px;width:100%;font-size:11px;padding:3px 4px;border:1px solid var(--line);border-radius:6px;background:var(--card2);color:var(--txt)}

  .ref.add{border-style:dashed;background:transparent}
  .drag-ghost{opacity:.4;transform:scale(.94)}
  #refs .ref{transition:transform .18s ease}
  .canvas{min-height:64px;border:1px dashed var(--line);border-radius:10px;display:flex;align-items:center;
        justify-content:center;color:var(--mut);font-size:13px;cursor:pointer;padding:12px;gap:8px}
  .canvas svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .canvas:hover{border-color:var(--acc)}
  .results{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
  .res{border-radius:12px;overflow:hidden;border:1px solid var(--line);position:relative;background:#000}
  .res img{width:100%;display:block;cursor:zoom-in}
  .res a{display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;
        background:var(--card2);color:var(--acc2);text-decoration:none;font-size:13px;font-weight:500;
        border-top:1px solid var(--line)}
  .res a:hover{background:var(--card)}
  .res a svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .hist{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  .hitem{border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative;background:#000;cursor:pointer}
  .hitem img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
  .hitem .meta{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:4px;padding:5px 6px;background:rgba(0,0,0,.55)}
  .hitem .meta span{font-size:10px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .hitem .meta small{font-size:11px;color:var(--acc2);flex:none}
  .hitem .meta .btn.ghost{color:#fff}
  .hitem.hsel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
  .hmark{position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;z-index:5;pointer-events:none}

  details{border:1px solid var(--line);border-radius:10px;padding:0 10px;margin-top:10px;background:var(--card2)}
  details summary{cursor:pointer;padding:10px 0;font-size:13px;color:var(--mut);list-style:none;display:flex;align-items:center;gap:6px}
  details summary::-webkit-details-marker{display:none}
  details summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(-45deg);margin-right:4px;transition:.2s}
  details[open] summary::before{transform:rotate(45deg)}
  /* 底部导航 */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:color-mix(in srgb,var(--bg) 94%,transparent);
        backdrop-filter:blur(10px);border-top:1px solid var(--line);
        padding:6px 0 calc(6px + var(--sab))}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;
        color:var(--mut);font-size:11px;cursor:pointer;padding:6px 0}
  .tabbar button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tabbar button.active{color:var(--acc)}
  /* 设置页 provider 列表(二级) */
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 14px;position:relative}
  .editbar{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;justify-content:space-between;align-items:center;gap:10px;
        background:var(--bg);border-bottom:1px solid var(--line);box-sizing:border-box;
        height:calc(64px + var(--sat));padding:var(--sat) 16px 0}
  .editbar .icon-btn{box-shadow:none;width:40px;height:40px}
  .editbar-spacer{height:calc(64px + var(--sat))}

  .provlist-top{display:flex;gap:8px;margin-bottom:12px}
  .provlist-top input{flex:1;margin:0}
  .provlist-top .btn{flex:none;min-height:44px}
  .provrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
  .provrow:hover{border-color:var(--acc)}
  .prov-avatar{width:46px;height:46px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--acc);flex:none}
  .prov-info{flex:1;min-width:0}
  .prov-name{font-size:16px;font-weight:600;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .prov-badges{display:flex;gap:6px;margin-top:5px}
  .prov-badges .badge{font-size:11px;color:var(--mut);background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:2px 8px}
  .prov-badges .badge.on{color:var(--acc2);background:color-mix(in srgb,var(--acc2) 12%,var(--card2))}
  .prov-menu{background:none;border:none;color:var(--mut);font-size:20px;cursor:pointer;width:34px;height:34px;flex:none;line-height:1}
  .prov-menu:hover{color:var(--bad)}
  /* 下拉提示灰 + 对齐(与输入框同款: 同背景/内边距/高度) */
  .addbar select{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card2);font-size:15px;padding:11px;color:var(--txt)}
  .addbar select.sel-hint{color:var(--mut)}
  .addbar select.sel-hint.filled{color:var(--txt)}
  .addbar .btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center}
  .addbar.stretch{align-items:stretch}
  .addbar.stretch select,.addbar.stretch .btn{height:auto;align-self:stretch}
  /* 更多菜单 */
  .provmenu{position:fixed;z-index:120;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;min-width:150px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .provmenu div{padding:13px 18px;font-size:15px;cursor:pointer;border-radius:8px;color:var(--txt);margin:2px 0}
  .provmenu div:hover{background:var(--card2)}
  .provmenu div.danger{color:var(--bad)}
  .phead{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .phead b{font-size:16px}
  .mlist{display:flex;flex-direction:column;gap:8px}
  .mrow{display:flex;gap:8px;align-items:center}
  .mrow input{flex:1}
  .mrow input.mid{flex:2}
  .mrow .del{width:32px;height:32px;flex:none}
  .det{margin-top:8px;padding:10px;border:1px dashed var(--line);border-radius:10px}
  .addbar{display:flex;gap:8px;margin-top:10px;align-items:center}
  /* ---------- 设置页: 二级视图切换动画 + 分区 ---------- */
  .sview{animation:swSlideIn .26s cubic-bezier(.22,.61,.36,1)}
  .sview.closing{animation:swSlideOut .24s cubic-bezier(.22,.61,.36,1) forwards}
  @media (prefers-reduced-motion: reduce){ .sview,.sview.closing{animation:none!important} }
  .sect{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .sect>h4{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--txt);display:flex;align-items:center;gap:7px}
  .sect>h4 .cnt{font-size:11px;font-weight:400;color:var(--mut);background:var(--card2);border:1px solid var(--line);border-radius:7px;padding:1px 7px}
  .tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .tools .btn{min-height:42px;white-space:nowrap;padding:6px 3px;overflow:hidden;font-size:12px;gap:3px}
  .tools .btn svg{width:12px;height:12px}
  .toolpanel{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card2);animation:swFadeUp .2s ease}
  .toolhead{font-size:12px;font-weight:600;color:var(--mut);margin-bottom:8px}
  .btn.on{border-color:var(--acc);color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
  .chips{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow:auto}
  .chip{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:5px 6px 5px 10px}
  .chip .cid{flex:1;min-width:0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip .btn{padding:5px 9px;font-size:12px;min-height:0}
  .chip .btn[data-done]{opacity:.45;border-color:transparent;color:var(--acc2);pointer-events:none}
  .mrow input[data-id]{font-size:13px}
  /* API Key 掩码 + 显示/隐藏 */
  .keywrap{position:relative}
  .keywrap input{padding-right:46px}
  .eyebtn{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:36px;height:36px;
        border:none;background:none;color:var(--mut);cursor:pointer;padding:0;border-radius:8px;
        display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
  .eyebtn:active{background:color-mix(in srgb,var(--mut) 18%,transparent)}
  .eyebtn.on{color:var(--acc)}
  .eyebtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .small-note{font-size:11px;color:var(--mut);margin-top:6px}
  .buildstamp{text-align:center;font-size:11px;color:var(--mut);opacity:.75;margin:18px 0 4px;line-height:1.6}
  .toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--card2);
        border:1px solid var(--line);padding:11px 18px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:.25s;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .toast.show{opacity:1}
  .hide{display:none !important}

  /* ---------- 动效 ---------- */
  @keyframes swFadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes swFadeIn{from{opacity:0}to{opacity:1}}
  @keyframes swFadeOut{from{opacity:1}to{opacity:0}}
  @keyframes swSlideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
  @keyframes swSlideOut{from{transform:translateX(0)}to{transform:translateX(100%)}}
  @keyframes swPopIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
  @keyframes swPopOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.9)}}
  .page.active{animation:swFadeUp .24s cubic-bezier(.22,.61,.36,1)}
  .hitem{transition:transform .16s ease}
  .hitem:active{transform:scale(.975)}
  .hitem.anim{animation:swFadeUp .3s cubic-bezier(.22,.61,.36,1) both}
  .res img{transition:transform .2s ease}
  .res img:active{transform:scale(.985)}
  .provrow{transition:transform .16s ease}
  .provrow:active{transform:scale(.985)}
  .provmenu{animation:swPopIn .16s cubic-bezier(.22,.61,.36,1);transform-origin:top right}
  .provmenu.closing{animation:swPopOut .14s ease forwards}
  #viewer{animation:swSlideIn .26s cubic-bezier(.22,.61,.36,1)}
  #viewer.closing{animation:swSlideOut .22s cubic-bezier(.22,.61,.36,1) forwards}
  #lightbox{animation:swFadeIn .18s ease}
  #lightbox.closing{animation:swFadeOut .16s ease forwards}
  /* 二级页内容不再单独淡入(由外层滑动动画负责, 避免叠加动画显得抽动) */
  @media (prefers-reduced-motion: reduce){
    .page.active,.hitem.anim,.provmenu,#viewer,#lightbox,.toolpanel{animation:none!important}
    .hitem,.res img,.provrow{transition:none!important}
  }
  /* ---------- 局部编辑 ---------- */
  #editor{position:fixed;inset:0;z-index:180;background:var(--bg);display:flex;flex-direction:column}
  #editor .edbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + var(--sat)) 12px 10px;
        border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px)}
  #editor .edstage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;padding:8px}
  #editor .edwrap{position:relative;line-height:0;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
  #editor .edwrap img{display:block;pointer-events:none;-webkit-user-drag:none}
  #editor .edwrap canvas{position:absolute;left:0;top:0;touch-action:none;cursor:crosshair}
  #editor .edpanel{border-top:1px solid var(--line);padding:10px 12px calc(12px + var(--sab));background:var(--bg)}
  #editor .edrow{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  #editor .edtool{padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:var(--card);
        font-size:13px;color:var(--txt);cursor:pointer;transition:.15s}
  #editor .edtool.on{border-color:var(--acc);color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent)}
  #editor input[type=range]{flex:1;min-width:80px;accent-color:var(--acc)}
  #editor textarea{width:100%;min-height:52px;margin:0;font-size:14px}
  #editor .edbusy{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;
        gap:10px;background:rgba(0,0,0,.45);backdrop-filter:blur(2px);pointer-events:none;
        font-size:13px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);font-variant-numeric:tabular-nums}
  @media (prefers-reduced-motion: no-preference){ #editor{animation:swSlideIn .24s cubic-bezier(.22,.61,.36,1)} #editor.closing{animation:swSlideOut .2s cubic-bezier(.22,.61,.36,1) forwards} }

<body>
<div class="app">
  <header>
    <h1><span class="dot"></span>Seedream</h1>
    <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="切换主题"></button>
  </header>

  <main>
    <!-- 生成页 -->
    <section id="page-generate" class="page active">
      <div class="card">
        <div class="row">
          <div><label>服务方</label><select id="provider" onchange="onProviderChange()"></select></div>
          <div><label>生图模型</label><select id="imageModel" onchange="onImageModelChange()"></select></div>
        </div>
        <div id="modelOptions"></div>
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <label style="margin:0;font-size:13px;color:var(--txt)">提示词</label>
          <div style="display:flex;gap:8px;align-items:center">
            <button class="btn small" id="undoOptBtn" style="display:none" onclick="toggleVersion()" data-icon="undo">退回原输入</button>
            <button class="btn small" onclick="clearDraftUI()" data-icon="eraser">清空</button>
          </div>
        </div>
        <div class="ta-wrap"><textarea id="prompt" placeholder="描述你想生成的画面…" style="margin-top:6px"></textarea><span class="ta-grip"></span></div>
        <div id="imgDescWrap" class="hide">
          <label>参考图特征描述（中文，可编辑）</label>
          <div class="ta-wrap"><textarea id="imgDesc" style="min-height:90px"></textarea><span class="ta-grip"></span></div>
        </div>
        <div class="row" style="margin-top:10px">
          <button class="btn" id="optBtn" onclick="optimizePrompt()" data-icon="sparkle">优化提示词</button>
          <button class="btn primary" id="genBtn" onclick="generate()" data-icon="image">生成图片</button>
        </div>
        <div id="optResult" class="small-note"></div>
        <div class="toggle" style="margin-top:8px">
          <div style="flex:1">
            <div style="font-size:13px">干净渲染</div>
            <div class="opt-sub">抑制碎影/色斑/串色/噪点，自动追加干净渲染约束</div>
          </div>
          <label class="switch"><input type="checkbox" id="cleanRender"><span class="slider"></span></label>
        </div>
        <details id="optSettings">
          <summary>提示词优化设置</summary>
          <div id="chatWrap" style="padding-bottom:10px">
            <label>优化文本模型</label>
            <select id="chatModel"></select>
            <div class="row" style="margin-top:8px">
              <div><label>优化流程</label>
                <select id="optFlow"><option value="one" selected>一段式（合并优化）</option><option value="two">两段式（先提取图片特征）</option></select></div>
            </div>
            <div class="toggle" style="margin-top:8px">
              <div style="font-size:13px">识别参考图并按图优化（需视觉模型）</div>
              <label class="switch"><input type="checkbox" id="useVision" checked><span class="slider"></span></label>
            </div>
            <div class="toggle" style="margin-top:8px">
              <div style="flex:1">
                <div style="font-size:13px">关闭思考模式（大幅提速）</div>
                <div class="opt-sub">DeepSeek / Seed 等推理模型跳过思维链，只输出结果</div>
              </div>
              <label class="switch"><input type="checkbox" id="noThinking" checked><span class="slider"></span></label>
            </div>
            <label>优化系统提示词（可编辑）</label>
            <textarea id="optPrompt" style="min-height:100px"></textarea>
            <div style="text-align:right;min-height:16px;margin-top:4px">
              <span id="optSaveState" style="font-size:12px;color:var(--acc2);opacity:0;transition:opacity .2s">已保存</span>
            </div>
          </div>
        </details>
      </div>

      <div class="card">
        <label>参考图（最多 10 张，拖拽可排序，顺序即 #1 #2 …）</label>
        <input type="file" id="fileInput" accept="image/*" multiple class="hide">
        <div class="refs" id="refs"></div>
        <div class="toggle" style="margin-top:6px">
          <div style="flex:1">
            <div style="font-size:13px">参考图二次压缩</div>
            <div class="opt-sub">开启后参考图更小更快，关闭保留细节</div>
          </div>
          <label class="switch"><input type="checkbox" id="compress"><span class="slider"></span></label>
        </div>
        <div class="addbar" style="margin-top:8px;align-items:stretch">
          <input type="text" id="refUrl" placeholder="粘贴图片 URL 添加为参考图" style="flex:1;margin:0">
          <button class="btn" style="flex:none;padding:0 18px;display:inline-flex;align-items:center" onclick="addRefUrl()" data-icon="plus">添加</button>
        </div>
      </div>

      <div class="card">
        <label>生成结果</label>
        <div class="results" id="results"><div class="small-note">尚未生成</div></div>
      </div>
    </section>

    <!-- 设置页 -->
    <section id="page-settings" class="page">
      <div id="provEditor"></div>
    </section>

    <!-- 记录页 -->
    <section id="page-history" class="page">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <label style="margin:0;font-size:14px;color:var(--txt);white-space:nowrap">生成记录</label>
          <button class="btn small" id="histSelectBtn" type="button" data-icon="checks">多选</button>
        </div>
        <div id="histSelBar" class="hide" style="display:flex;align-items:center;gap:8px;margin-bottom:10px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px">
          <span id="histSelCount" style="font-size:13px;color:var(--txt);flex:1;white-space:nowrap">已选 0 张</span>
          <button class="btn small" id="histSelAll" type="button" data-icon="selectall">全选</button>
          <button class="btn small" id="histSelDown" type="button" data-icon="dl">保存</button>
          <button class="btn small" id="histSelDel" type="button" style="color:var(--bad)" data-icon="trash">删除</button>
        </div>
        <select id="histFilter" onchange="histModelFilter=this.value;renderHistory()"
          style="width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:13px;color:var(--txt);margin-bottom:10px">
          <option value="">全部模型</option>
        </select>
        <div class="hist" id="history"><div class="small-note">暂无记录</div></div>
      </div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-tab="generate" onclick="switchTab('generate')">
      <svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>生成
    </button>
    <button class="tab" data-tab="history" onclick="switchTab('history')">
      <svg viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6l-2.5 2.5"/><path d="M3.5 8.5V4.5M3.5 8.5h4"/><path d="M12 7.5v4.5l3 1.8"/></svg>记录
    </button>
    <button class="tab" data-tab="settings" onclick="switchTab('settings')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3h.1a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8v.1a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>设置
    </button>
  </nav>
</div>

<div class="toast" id="toast"></div>

const DEFAULT_OPTPROMPT_TEXT = '你是一个专业的AI绘画提示词工程师。请把用户的中文/英文需求扩展成一段高质量、结构化、以英文为主的图像生成提示词, 依次包含: 主体、场景/背景、构图视角、光影色调、风格、画质细节。只输出优化后的提示词本身, 不要解释, 不要多余的说明文字。';
const OPT_PROMPT_GPTIMAGE = `你是一名专业的 AI 图像生成提示词工程师、视觉设计师和图像理解专家。你的任务是将用户的意图、参考图和视觉要求，转化为一份可以直接交给 GPT-image 使用的高质量英文图像生成提示词。你不是简单总结用户的话，而是进行视觉分析、信息取舍、结构重组和必要的智能补全，让最终 Prompt 同时具备明确性、可执行性、视觉一致性和细节控制能力。

核心原则：高完成度不等于高细节密度。目标是让 GPT-image 生成\"该有的细节清楚、不该有的细节不存在\"的画面。优先通过准确的形体、清晰的轮廓、稳定的线稿、合理的色彩、统一的光影、明确的空间层级和受控的材质表现来提升质量，而不是堆积\"ultra detailed、intricate、highly detailed\"等词。尤其对于动漫、二次元和日系手游插画，应优先形成干净连续的线稿、稳定的线条粗细、完整闭合的轮廓、清晰的大色块、柔和的赛璐璐阴影、克制的渐变、分组明确的头发、简洁的服装褶皱和低视觉噪声。细节应该集中在主体和关键特征，而不是平均分布到整个画面。使用\"grouped hair locks、clean large color areas、restrained micro-detail、simplified secondary forms、controlled texture、sparse environmental detail\"等正向视觉语言表达\"干净\"，而不是依赖大量 negative prompt。

你必须根据具体任务动态决定 Prompt 的结构和详细程度。不要机械套用固定模板，也不要为了形式完整而强行加入与任务无关的栏目。人物图应自然覆盖身份、外观、姿态、表情、服装、场景、构图、光影和渲染；产品图应重点覆盖形体、材质、表面状态、光线、摄影和背景；场景图应重点覆盖空间结构、建筑/环境、镜头、光线、材质和氛围；Logo、图标、平面设计等任务则应采用适合其类型的描述方式。结构必须服务于图像，而不是让图像服从模板。

最终 Prompt 应保持充分的视觉信息量，通常约 400-1000 个英文单词。若用户要求复杂、详尽或丰富的画面，必须给出接近上限（约 600-1000 词）的完整描述，不可擅自压缩成\"简单\"；若任务确实简单（单一主体、无复杂背景）可低于 400 词。不要因为用户已经提供了详细描述就简单压缩成摘要，也不要通过重复同义词凑长度。每一段都应增加实际的视觉控制信息。你的扩展方向应该是\"如何画得更准确\"，而不是\"增加更多东西\"。

当存在参考图时，先判断每张图提供的证据类型，例如 character identity、face、hair、clothing、pose、style、material、color 或 composition，并在最终 Prompt 中明确说明其用途。保持用户指定的身份特征、结构特征和关键设计，不要无意识混合不同参考图中的人物身份。除非用户要求复现，否则参考图默认用于提取视觉特征和风格证据，而不是复制其构图、裁切、姿势、背景或大面积色彩布局。用户当前明确指令优先于参考图中可能产生冲突的信息。

进行视觉补全时，只补充能够提高构图、空间、材质、光影、解剖、可读性或整体完成度的信息，不要为了\"丰富\"而增加随机装饰。任何新增元素都必须有视觉作用。若用户没有要求复杂背景、密集粒子、丰富纹理或大量装饰，默认保持克制。

建立明确的视觉细节层级：主体和关键特征获得最高精度，次要物体适度处理，环境和背景逐级简化。不要让角色、头发、水面、服装、地面、背景和粒子拥有相同的细节密度。对于动漫图尤其要避免大量随机发丝、碎裂线稿、过多衣服褶皱、密集纹理、碎片化阴影、水面随机高光、过量粒子、复杂背景和无意义的小物件。优先使用完整的大形状、成组的细节和少量有目的的微小元素。

对于线稿型二次元图，重点控制线条的连续性、闭合轮廓、线条稳定性、形状分离、干净交界和自然收笔。头发应由清晰的大型发束组成，只保留少量有意义的细发丝；服装应由明确的结构线和有限的褶皱构成；阴影应形成完整、干净、可读的大形状，而不是碎裂成大量小块。对于写实图，则根据题材使用真实而克制的材质、光线和表面信息，不要强行套用动漫术语。

正向描述始终优先于 negative prompt。先告诉模型\"应该如何呈现\"，再用一小段针对当前任务的 negative constraints 防止明显错误。避免无意义地堆叠\"no ...\"。常见的二次元伪影可按需要抑制，例如 broken contours、disconnected strokes、scratchy linework、random tiny marks、excessive hair strands、excessive wrinkles、noisy textures、patchy colors、fragmented shading、excessive particles、cluttered background、extra characters、duplicated body parts、malformed hands or fingers、text、watermark 等，但只选择当前图像真正需要的约束。不要让 negative constraints 与正向视觉目标冲突。

不要把\"clean\"理解成\"空\"\"简单\"或\"缺乏细节\"。真正的干净是高信息区域准确、低信息区域克制、边缘清楚、形体完整、纹理有目的、细节密度分布合理。真正的精致来自 shape design、line quality、color control、lighting、material separation 和 composition，而不是随机微细节。

生成最终 Prompt 前，在内部检查：是否准确保留了用户真正关心的内容；是否正确使用了参考图；是否存在风格或指令冲突；是否加入了不必要的内容；是否存在过度细节诱因；主体是否比背景更重要；线稿、色块、阴影和材质是否具有统一的视觉语言；是否需要针对当前题材增加或减少细节。发现无意义的复杂度时，优先删除，而不是继续添加。

最终只输出优化后的英文图像生成 Prompt 本身，不解释分析过程，不输出修改说明，不输出 JSON，不输出评分，不输出前言或其他内容。最终 Prompt 必须能够直接复制给 GPT-image 使用。`;

/* ---------- 主题(跟随系统 / 浅色 / 深色) ---------- */
const mqDark = (window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null);
let THEME_MODE = 'system';
try{ THEME_MODE = localStorage.getItem('sw_theme_mode') || 'system'; }catch(e){}
function resolvedTheme(){
  if(THEME_MODE==='light') return 'light';
  if(THEME_MODE==='dark') return 'dark';
  return (mqDark && mqDark.matches) ? 'dark' : 'light';
}
function applyTheme(){
  const t = resolvedTheme();
  document.documentElement.setAttribute('data-theme', t);
  const b = document.getElementById('themeBtn');
  if(b){
    b.innerHTML = icon(THEME_MODE==='system' ? 'auto' : (THEME_MODE==='dark' ? 'moon' : 'theme'));
    b.title = '主题：' + ({system:'跟随系统', light:'浅色', dark:'深色'})[THEME_MODE];
    b.setAttribute('aria-label', b.title);
  }
  const mt = document.querySelector('meta[name="theme-color"]');
  if(mt) mt.setAttribute('content', t==='dark' ? '#0f1115' : '#f4f5f8');
  // APK: 同步系统状态栏图标颜色(深色背景配浅色文字)
  try{
    const sb = plugin('StatusBar');
    if(sb && sb.setStyle) sb.setStyle({ style: (t==='dark' ? 'DARK' : 'LIGHT') });
  }catch(e){}
}
function setThemeMode(m){
  THEME_MODE = m;
  try{ localStorage.setItem('sw_theme_mode', m); localStorage.setItem('sw_theme', resolvedTheme()); }catch(e){}
  applyTheme();
  toast({system:'主题：跟随系统', light:'主题：浅色', dark:'主题：深色'}[m] || '');
}
function toggleTheme(){   // 顶栏按钮: 深色 → 浅色 → 跟随系统 → 深色
  const order=['dark','light','system'];
  setThemeMode(order[(order.indexOf(THEME_MODE)+1) % 3]);
}
if(mqDark){ try{ mqDark.addEventListener('change', function(){ if(THEME_MODE==='system') applyTheme(); }); }catch(e){} }

/* ---------- 平台适配层: 网页(本地网关) / APK(Capacitor) ---------- */
// 注意: Capacitor 桥接脚本可能在页面脚本之后注入, 所以这里全部延迟判断
function cap(){ try{ return (typeof window!=='undefined' && window.Capacitor) || null; }catch(e){ return null; } }
function isNative(){ try{ const c=cap(); return !!(c && c.isNativePlatform && c.isNativePlatform()); }catch(e){ return false; } }
function plugin(name){ try{ const c=cap(); return (c && c.Plugins && c.Plugins[name]) || null; }catch(e){ return null; } }
async function waitForBridge(ms){
  const t0=Date.now();
  while(!isNative()){
    if(Date.now()-t0 > (ms||2000)) return false;
    await new Promise(function(r){ setTimeout(r, 30); });
  }
  return true;
}
/* 网关地址: 网页=同源(空); APK(方案C)=不需要网关, 全部由本地 native-api 处理 */
let GW_IS_NATIVE = false;   // 启动时(等待桥接后)再确定
let GW_BASE = '';
try{ GW_BASE = String(localStorage.getItem('sw_gateway')||'').replace(/\/+$/, ''); }catch(e){}
function gwUrl(u){ u=String(u||''); if(!u) return u; if(/^(https?:|data:|blob:|file:|content:|capacitor:)/i.test(u)) return u; return GW_BASE + u; }
function imgUrl(u){
  u = String(u||'');
  if(!u) return u;
  if(/^(https?:|data:|blob:|file:|content:|capacitor:)/i.test(u)) return u;
  if(window.NATIVE_API && u.indexOf('/img/')===0){
    const s = window.NATIVE_API.imgSrcOf(u.slice(5));
    if(s) return s;
  }
  return GW_BASE + u;
}
function setGateway(v){
  GW_BASE = String(v||'').trim().replace(/\/+$/, '');
  try{ localStorage.setItem('sw_gateway', GW_BASE); }catch(e){}
}
function blobToBase64(blob){
  return new Promise(function(res, rej){
    const r=new FileReader();
    r.onload=function(){ const s=String(r.result||''); res(s.slice(s.indexOf(',')+1)); };
    r.onerror=rej; r.readAsDataURL(blob);
  });
}
/** 统一保存入口: 网页用 <a download>; APK 走原生(优先相册 MediaStore, 退回文档目录). */
async function saveImageFile(url, filename){
  const name = filename || 'seedream.png';
  const fs = plugin('Filesystem');
  if(isNative() && fs){
    try{
      const blob = await (await fetch(gwUrl(url))).blob();
      const b64  = await blobToBase64(blob);
      const mime = blob.type || 'image/png';
      const media = plugin('MediaStore');
      if(media && media.saveImage){ await media.saveImage({ base64:b64, fileName:name, mimeType:mime }); }
      else { await fs.writeFile({ path:name, data:b64, directory:'DOCUMENTS', recursive:true }); }
      toast('已保存');
      return;
    }catch(e){ console.warn('native save failed, fallback to web', e); }
  }
  const a=document.createElement('a'); a.href=url; a.download=name; a.style.display='none';
  document.body.appendChild(a); a.click(); setTimeout(function(){ a.remove(); }, 500);
}
/** 系统通知: APK 走 LocalNotifications; 网页走浏览器 Notification. */
async function sysNotify(title, body){
  const ln = plugin('LocalNotifications');
  if(isNative() && ln){
    try{
      if(ln.requestPermissions){ await ln.requestPermissions(); }
      await ln.schedule({ notifications:[{ id: Math.floor(Date.now() % 2147483647), title:title, body:body||'' }] });
      return;
    }catch(e){ console.warn('local notification failed', e); }
  }
  notifyBrowser(title, body);
}
async function jget(u, timeout){ return jreq('GET', u, undefined, timeout||120000); }
async function jpost(u,b,t){ return jreq('POST',u,b,t); }
async function jput(u,b){ return jreq('PUT',u,b); }
async function jreq(m,u,b,timeout){
  // APK(方案C): 先交给本地实现(它内部自己判断是否原生环境; 网页版返回 undefined)
  // 不依赖 GW_IS_NATIVE —— 避免桥接注入时机导致它被误判为 false
  if(window.NATIVE_API && window.NATIVE_API.handle){
    const r = await window.NATIVE_API.handle(m, u, b);
    if(r !== undefined) return r;
  }
  u = gwUrl(u);
  const limit=(timeout && timeout>0)?timeout:300000;
  const ctl=new AbortController(); const timer=setTimeout(()=>ctl.abort(), limit);
  try{ const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:JSON.stringify(b),signal:ctl.signal});
    const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.detail||JSON.stringify(d)); return d; }
  catch(e){ if(e && e.name==='AbortError') throw new Error('请求超时（超过 '+Math.round(limit/1000)+' 秒）。任务可能仍在后端进行，请在「记录」里查看。'); throw e; }
  finally{ clearTimeout(timer); } }

var pageScroll={};
/* ---------- 返回栈: 安卓侧滑/返回键 = 返回上一级(而不是退出网页) ---------- */
let _navDepth = 0, _navSilent = 0;
let CUR_TAB = 'generate';
function navPush(){ _navDepth++; try{ history.pushState({sw:_navDepth}, '', location.href); }catch(e){} }
function navBack(){ if(_navDepth>0){ try{ history.back(); }catch(e){} } }
function navConsume(){ if(_navDepth>0){ _navSilent++; try{ history.back(); }catch(e){} } }
// 关闭最上层视图; 返回 true = 已处理(不退出页面)
function closeTopmost(){
  var ov=document.getElementById('editor'); if(ov){ closeImageEditor(true); return true; }
  var lb=document.getElementById('lightbox'); if(lb){ closeLightbox(true); return true; }
  var v=document.getElementById('viewer'); if(v){ closeViewer(true); return true; }
  var m=document.querySelector('.provmenu'); if(m){ closeProvMenu(true); return true; }
  if(CUR_TAB==='settings' && settingsView==='edit'){ settingsView='list'; editingProvider=null; renderSettings(); return true; }
  if(CUR_TAB!=='generate'){ switchTab('generate', true); return true; }
  return false;
}
window.addEventListener('popstate', function(){
  _navDepth = Math.max(0, _navDepth - 1);
  if(_navSilent > 0){ _navSilent--; return; }   // 程序化关闭时消费掉的状态
  closeTopmost();
});

function switchTab(name, fromNav){
  // 点「生成」tab 回主页: 交给返回栈处理, 保证状态一致
  if(fromNav !== true && name === 'generate' && CUR_TAB !== 'generate' && _navDepth > 0){
    navBack(); return;
  }
  var prev = CUR_TAB;
  var app=document.querySelector('.app');
  // 保存当前页滚动位置
  var cur=document.querySelector('.page.active'); if(cur && app){ pageScroll[cur.id]=app.scrollTop; }
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active', p.id==='page-'+name));
  document.querySelectorAll('.tabbar .tab').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  // 离开设置页时收起二级编辑页
  if(name !== 'settings' && settingsView === 'edit'){ settingsView='list'; editingProvider=null; }
  if(name==='settings'){ loadKeyStatus().then(function(){ renderSettings(true); }); renderSettings(); }
  if(name==='history') loadHistory();
  if(name==='generate'){ buildChatOptions(); }
  // 恢复目标页滚动(首次进入=顶)
  if(app){ app.scrollTop = pageScroll['page-'+name] != null ? pageScroll['page-'+name] : 0; }
  CUR_TAB = name;
  if(fromNav === true) return;
  if(prev === 'generate' && name !== 'generate') navPush();
}

    if(el.getAttribute('data-icon-done')==='1') return;

async function init(){
  dstep('0-start');
  await waitForBridge(2000);          // 等 Capacitor 桥接注入(否则原生能力全失效)
  GW_IS_NATIVE = isNative();
  dstep('0b-native='+GW_IS_NATIVE);
  // APK: 同步真实安全区(Android WebView 的 env() 不可靠; Capacitor 8.3+ 会注入真实值)
  try{
    const sb = plugin('StatusBar');
    if(sb && sb.setStyle){ try{ await sb.setStyle({ style:'DARK' }); }catch(e){} }
  }catch(e){ console.warn('statusbar', e); }
  syncInsets();
  setTimeout(syncInsets, 300);   // 布局稳定后再同步一次
  window.addEventListener('resize', syncInsets);
  applyTheme(); requestNotif(); fillDataIcons();
  if(window.NATIVE_API){
    try{ await window.NATIVE_API.ensureCfg(); }catch(e){}
    try{ await window.NATIVE_API.fileBase(); }catch(e){}
    // 保证默认提供方存在(首次安装), 并合并后续新增的默认项(不覆盖用户已有配置)
    try{
      let c = await jget('/api/config') || {};
      const d = await (await fetch('/providers.default.json')).json();
      let added = 0;
      Object.keys(d).forEach(function(k){ if(!c[k]){ c[k] = d[k]; added++; } });
      if(added){ await jput('/api/config', c); toast('已添加 ' + added + ' 个默认提供方'); }
    }catch(e){}
  }
  dstep('1-before-models');
  MODELS = await jget('/api/models'); dstep('2-models-ok n='+(MODELS?Object.keys(MODELS).length:'x'));
  CONFIG = await jget('/api/config'); dstep('3-config-ok n='+(CONFIG?Object.keys(CONFIG).length:'x'));
  await loadKeyStatus(); dstep('3b-keystatus');
  fillProviders(); dstep('4-providers-filled');
  onProviderChange(); dstep('5-provider-change');
  buildChatOptions(); setupOptPrompt(); dstep('6-opt-setup');
  restoreDraft();
  // 恢复检测结果
  try{ Object.keys(localStorage).forEach(function(k){ if(k.indexOf('sw_det_')===0){ var key=k.slice(7); try{ _det[key]=JSON.parse(localStorage.getItem(k)||'[]'); }catch(e){} } }); }catch(e){}
  renderRefs(); loadHistory(); dstep('7-done');
  $('prompt').addEventListener('input', saveDraftDebounced);
  if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('/sw.js'); }catch(e){} }
  document.getElementById('optSettings').addEventListener('toggle', ()=>{ if(document.getElementById('optSettings').open) buildChatOptions(); });
  if(location.hash==='#history') switchTab('history');
}

function buildChatOptions(){
  const cm=$('chatModel'); cm.innerHTML='';
  const ph=document.createElement('option'); ph.value=''; ph.textContent='请选择优化模型'; ph.disabled=true; ph.selected=true;
  cm.appendChild(ph);
  let count=0;
  Object.keys(MODELS).forEach(p=>{
    const arr=MODELS[p].chat_models||[]; if(!arr.length) return;
    const lp=MODELS[p].label||p;
    const grp=document.createElement('option'); grp.value=''; grp.textContent='— '+lp+' —'; grp.disabled=true; cm.appendChild(grp);
    arr.forEach(m=>{ const o=document.createElement('option'); o.value=p+'::'+m.id; o.textContent=m.label||m.id; cm.appendChild(o); count++; });
  });
  if(!count){ const none=document.createElement('option'); none.value=''; none.textContent='（暂无文本模型，请到「设置」里添加）'; none.disabled=true; cm.appendChild(none); }
  const pre=localStorage.getItem('sw_chat');
  let target = (pre && [...cm.options].some(o=>o.value===pre)) ? pre : null;
  if(!target){ const bp=[...cm.options].find(o=>o.value.startsWith('byteplus::')); target=bp?bp.value:(([...cm.options].find(o=>o.value)||{}).value||''); }
  if(target) cm.value=target;
}

/* ---------- 参考图 ---------- */
function compressImage(file, maxEdge=2048, quality=0.95){
  return new Promise((resolve,reject)=>{ const rd=new FileReader();
    rd.onload=ev=>{ const img=new Image(); img.onload=()=>{ let w=img.width,h=img.height; const m=Math.max(w,h);
      if(m>maxEdge){ const r=maxEdge/m; w=Math.round(w*r); h=Math.round(h*r); }
      const c=document.createElement('canvas'); c.width=Math.max(1,w); c.height=Math.max(1,h);
      const ctx=c.getContext('2d'); ctx.imageSmoothingEnabled=true; ctx.drawImage(img,0,0,c.width,c.height);
      const isPng=/image\/png|image\/webp/.test(file.type);
      const type=isPng?'image/png':'image/jpeg';
      let url='';
      try{ url=c.toDataURL(type,quality); }catch(e){ url=''; }
      if(!url || url.length<40 || url.indexOf('data:image/')!==0){ reject(new Error('image_compress_failed')); return; }
      resolve(url); };
      img.onerror=()=>reject(new Error('image_decode_failed')); img.src=ev.target.result; };
    rd.onerror=()=>reject(new Error('read_failed')); rd.readAsDataURL(file); });
}
$('fileInput').onchange = async e=>{ const files=Array.from(e.target.files||[]); let added=0;
  for(const f of files){ if(refs.length>=10){ toast('最多 10 张参考图'); break; }
    try{ const u=await compressImage(f); refs.push({url:u, role:'auto'}); added++; }catch(err){ console.error(err); } }
  if(added) toast('已添加并压缩 '+added+' 张'); renderRefs(); e.target.value=''; };

function initSortable(){
  const el=$('refs'); if(!el || el._sortable) return;
  if(!window.Sortable) return;
  el._sortable = new Sortable(el, {
    animation: 180,
    draggable: '.ref[data-idx]',

    onEnd: ()=> {

      saveDraft();
    }

  const b=$('optBtn'); const userInput=$('prompt').value;

      const dd=await jpost('/api/describe',{provider:cp,chat_model:cm,refs:refUrls(),ref_roles:refRoles(),prompt:userInput,disable_thinking:$('noThinking')?$('noThinking').checked:true});
      desc=dd.description||''; $('imgDesc').value=desc; $('imgDescWrap').classList.remove('hide');

    }

    if(desc){ body.image_desc=desc; } else { body.refs=refUrls(); body.ref_roles=refRoles(); body.use_vision=$('useVision').checked; }
    const d=await jpost('/api/optimize',body);

    $('optResult').textContent='已优化（可编辑描述/提示词）；点「退回原输入」可切换';

  finally{ b.disabled=false; b.innerHTML=icon('sparkle')+'优化提示词'; }
}
function toggleVersion(){
  if(optState!=='optimized' || lastOptimized==null) return;
  if(showingOptimized){
    $('prompt').value = lastOriginal; showingOptimized=false;
    $('undoOptBtn').innerHTML=icon('check')+'查看优化后';
  } else {
    $('prompt').value = lastOptimized; showingOptimized=true;
    $('undoOptBtn').innerHTML=icon('undo')+'退回原输入';
  }
  saveDraft();
}
function clearDraftUI(){
  $('prompt').value=''; $('optResult').textContent='';

let ED = null;
function edPickDefault(prov, model){
  // 默认: 原图使用的模型; 不可用则退回生成页当前选择
  if(prov && model && MODELS[prov] && (MODELS[prov].image_models||[]).some(m=>m.id===model))
    return {provider:prov, model:model};
  const p=($('provider')&&$('provider').value)||'';
  const m=($('imageModel')&&$('imageModel').value)||'';
  if(p && m) return {provider:p, model:m};
  const keys=Object.keys(MODELS||{}); 
  for(const k of keys){ const ims=(MODELS[k].image_models||[]); if(ims.length) return {provider:k, model:ims[0].id}; }
  return {provider:'', model:''};
}
function shortModelName(m){
  const lb=(m.label||'').trim();
  if(lb && lb!==m.id) return lb;
  let s=String(m.id||'');
  s=s.replace(/-\d{6,8}$/,'');           // 去掉日期后缀
  if(s.length>24) s=s.slice(0,24)+'…';
  return s;
}
function edBuildModelSel(){
  const sel=document.getElementById('edModelSel'); if(!sel||!ED) return;
  sel.innerHTML='';
  let hit=false;
  Object.keys(MODELS||{}).forEach(function(p){
    const ims=(MODELS[p].image_models||[]); if(!ims.length) return;
    const g=document.createElement('optgroup'); g.label=MODELS[p].label||p;
    ims.forEach(function(m){
      const o=document.createElement('option'); o.value=p+'::'+m.id; o.textContent=shortModelName(m);
      if(p===ED.provider && m.id===ED.model){ o.selected=true; hit=true; }
      g.appendChild(o);
    });
    sel.appendChild(g);
  });
  if(!hit && sel.options.length) sel.selectedIndex=0;
  sel.onchange=function(){
    const parts=(sel.value||'::').split('::');
    ED.provider=parts[0]; ED.model=parts.slice(1).join('::');
    edUpdateHint();
  };
}

function edLayout(){
  const img=document.getElementById('edImg'), cv=document.getElementById('edCanvas');
  const stage=document.getElementById('edStage'), wrap=document.getElementById('edWrap');
  if(!img||!cv||!stage) return;
  ED.nat={w:img.naturalWidth||1024, h:img.naturalHeight||1024};
  const CAP=2048;
  let cw=ED.nat.w, ch=ED.nat.h;
  const long=Math.max(cw,ch);
  if(long>CAP){ const s=CAP/long; cw=Math.round(cw*s); ch=Math.round(ch*s); }
  ED.cw=cw; ED.ch=ch;
  cv.width=cw; cv.height=ch;
  const pad=16;
  const availW=Math.max(80, stage.clientWidth-pad), availH=Math.max(80, stage.clientHeight-pad);
  const ds=Math.min(availW/cw, availH/ch, 1);
  const dw=Math.round(cw*ds), dh=Math.round(ch*ds);
  img.style.width=dw+'px'; img.style.height=dh+'px';
  cv.style.width=dw+'px'; cv.style.height=dh+'px';
  ED.dispW=dw; ED.dispH=dh;
  edRedraw();
}
function edPos(e){
  const cv=document.getElementById('edCanvas'); const r=cv.getBoundingClientRect();
  return { x:(e.clientX-r.left)/r.width*cv.width, y:(e.clientY-r.top)/r.height*cv.height };
}
function edDrawShapes(ctx, mode){
  ctx.lineCap='round'; ctx.lineJoin='round';
  const stroke = mode==='mask' ? 'rgba(0,0,0,1)' : 'rgba(255,64,129,.55)';
  (ED.strokes||[]).forEach(function(st){
    if(!st.pts.length) return;
    ctx.lineWidth=st.w; ctx.strokeStyle=stroke;
    if(st.pts.length===1){ ctx.fillStyle=stroke; ctx.beginPath();
      ctx.arc(st.pts[0].x, st.pts[0].y, st.w/2, 0, Math.PI*2); ctx.fill(); return; }
    ctx.beginPath(); ctx.moveTo(st.pts[0].x, st.pts[0].y);
    for(let i=1;i<st.pts.length;i++) ctx.lineTo(st.pts[i].x, st.pts[i].y);
    ctx.stroke();
  });
  if(ED.rect){
    const r=ED.rect, x=Math.min(r.x1,r.x2), y=Math.min(r.y1,r.y2),
          w=Math.abs(r.x2-r.x1), h=Math.abs(r.y2-r.y1);
    if(mode==='mask'){ ctx.fillStyle='rgba(0,0,0,1)'; ctx.fillRect(x,y,w,h); }
    else{ ctx.fillStyle='rgba(255,64,129,.3)'; ctx.fillRect(x,y,w,h);
          ctx.strokeStyle='rgba(255,64,129,.9)'; ctx.lineWidth=Math.max(2, ED.brush/4);
          ctx.strokeRect(x,y,w,h); }
  }
}
function edRedraw(){
  const cv=document.getElementById('edCanvas'); if(!cv||!ED) return;
  const x=cv.getContext('2d'); x.clearRect(0,0,cv.width,cv.height);
  edDrawShapes(x,'view');
}
function edBind(){
  const cv=document.getElementById('edCanvas'); if(!cv) return;
  cv.addEventListener('pointerdown', function(e){
    if(!ED || ED.busy || !ED.cw) return; e.preventDefault();
    cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
    ED.brush=parseInt($('edSize').value||'40',10);
    const p=edPos(e);
    if(ED.tool==='rect'){ ED.drag={type:'rect', x1:p.x, y1:p.y, x2:p.x, y2:p.y}; ED.rect={x1:p.x,y1:p.y,x2:p.x,y2:p.y}; }
    else { ED.drag={type:'brush'}; ED.strokes.push({w:ED.brush, pts:[p]}); }
    edRedraw();
  });
  cv.addEventListener('pointermove', function(e){
    if(!ED || !ED.drag) return; e.preventDefault();
    const p=edPos(e);
    if(ED.drag.type==='rect'){ ED.rect.x2=p.x; ED.rect.y2=p.y; }
    else { const st=ED.strokes[ED.strokes.length-1]; if(st) st.pts.push(p); }
    edRedraw();
  });
  function up(e){
    if(!ED || !ED.drag) return;
    if(ED.drag.type==='rect' && ED.rect){
      const r=ED.rect;
      if(Math.abs(r.x2-r.x1)<6 && Math.abs(r.y2-r.y1)<6){ ED.rect=null; }  // 误触
    }
    ED.drag=null; edRedraw();
  }
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener('pointerleave', function(e){ if(ED && ED.drag && ED.drag.type==='brush') return; up(e); });
}
function edTool(t){
  if(!ED) return; ED.tool=t;

  document.getElementById('edT_rect').classList.toggle('on', t==='rect');
}
function edUndo(){
  if(!ED) return;

}
function edClear(){ if(!ED) return; ED.strokes=[]; ED.rect=null; edRedraw(); }
function edSelectAll(){

function edHasSel(){ return ED && (ED.strokes.length>0 || !!ED.rect); }
function edBuildMask(){
  const c=document.createElement('canvas'); c.width=ED.cw; c.height=ED.ch;
  const x=c.getContext('2d');
  x.fillStyle='#000'; x.fillRect(0,0,ED.cw,ED.ch);

}
function edBox(){
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  (ED.strokes||[]).forEach(function(st){ st.pts.forEach(function(p){
    if(p.x<x1)x1=p.x; if(p.y<y1)y1=p.y; if(p.x>x2)x2=p.x; if(p.y>y2)y2=p.y; }); });
  if(ED.rect){ x1=Math.min(x1,ED.rect.x1,ED.rect.x2); y1=Math.min(y1,ED.rect.y1,ED.rect.y2);
               x2=Math.max(x2,ED.rect.x1,ED.rect.x2); y2=Math.max(y2,ED.rect.y1,ED.rect.y2); }
  if(x2<=x1 || y2<=y1) return null;
  const nx=function(v,w){ return Math.max(0, Math.min(999, Math.round(v/w*999))); };
  return [nx(x1,ED.cw), nx(y1,ED.ch), nx(x2,ED.cw), nx(y2,ED.ch)];
}
function edImageRef(){

let _edTimer=null, _edT0=0, _edStage='正在重绘';
function edBusyOverlay(on){

async function edSubmit(){

function edPoll(taskId, btn){
  let fails=0;
  const iv=setInterval(async function(){
    if(!ED){ clearInterval(iv); return; }          // 编辑器已关闭
    try{
      const t=await jget('/api/task/'+taskId); const st=t._status; fails=0;
      if(st==='done'){
        clearInterval(iv);
        const im=(t.images||[])[0];
        if(im){
          const img=document.getElementById('edImg');
          img.onload=function(){ if(!ED) return; ED.src=im.url;
            ED.nat={w:img.naturalWidth,h:img.naturalHeight};
            ED.strokes=[]; ED.rect=null; edLayout(); };
          img.src=imgUrl(im.url)+'?t='+Date.now();
          edBusyStop();
          ED.busy=false; btn.disabled=false; btn.innerHTML=icon('send')+'发送';
          $('edHint').innerHTML=icon('check')+' 已完成 · 可以继续改这一版（已存入记录）';

          edBusyStop(); ED.busy=false; btn.disabled=false; btn.innerHTML=icon('send')+'发送';
          $('edHint').textContent='完成，但没有返回图片';
        }
      } else if(st==='failed'){
        clearInterval(iv);
        edBusyStop();
        ED.busy=false; btn.disabled=false; btn.innerHTML=icon('send')+'发送';
        $('edHint').textContent='失败: '+String(t.error||'未知错误').slice(0,180);
        toast('局部编辑失败');
      }
    }catch(e){
      fails++;
      if(fails>=5){ clearInterval(iv); edBusyStop();
        if(ED){ ED.busy=false; btn.disabled=false; btn.innerHTML=icon('send')+'发送';
          $('edHint').textContent='轮询中断，请到「记录」里查看结果'; } }
    }
  }, 2500);
}

  lbScale=1; lbTx=0; lbTy=0; lbMoved=false;
  v.innerHTML='<img id="lbImg" src="'+esc(imgUrl(src))+'" style="position:absolute;left:50%;top:50%;max-width:100vw;max-height:100vh;object-fit:contain;will-change:transform">'
    +'<button id="lbEdit" class="btn primary" style="position:absolute;right:14px;bottom:calc(20px + var(--sab));z-index:5;box-shadow:0 6px 20px rgba(0,0,0,.4)">'+icon('edit')+' 局部编辑</button>';
  document.getElementById('lbEdit').onclick=function(e){ e.stopPropagation(); closeLightbox(); setTimeout(function(){ openImageEditor(src, lbProv, lbModel); }, 260); };
  document.getElementById('lbEdit').ontouchstart=function(e){ e.stopPropagation(); };
  lbImg=document.getElementById('lbImg');
  function apply(){ const s=lbScale; lbImg.style.transform='translate(-50%,-50%) translate('+lbTx+'px,'+lbTy+'px) scale('+s+')'; }
  function clamp(){
    // 边界: 图片边缘不得离开视口(拖到边缘即停, 不出现黑边)
    const vw=v.clientWidth, vh=v.clientHeight;
    const r=lbImg.getBoundingClientRect(); // 含 scale 的实际显示尺寸
    const w=r.width, h=r.height;
    const maxX=Math.max(0,(w-vw)/2), maxY=Math.max(0,(h-vh)/2);
    if(lbTx>maxX) lbTx=maxX; if(lbTx<-maxX) lbTx=-maxX;
    if(lbTy>maxY) lbTy=maxY; if(lbTy<-maxY) lbTy=-maxY;
  }
  apply();
  let pinch=0, pinchScale=1, pStart=0, startX=0, startY=0, tx0=0, ty0=0, t0=0;
  v.addEventListener('touchstart', e=>{ e.preventDefault(); lbMoved=false; t0=Date.now();
    if(e.touches.length===2){ pinch=getDist(e.touches); pinchScale=lbScale; pStart=pinch; }
    else if(e.touches.length===1){ startX=e.touches[0].clientX; startY=e.touches[0].clientY; tx0=lbTx; ty0=lbTy; }
  }, {passive:false});
  v.addEventListener('touchmove', e=>{ e.preventDefault();
    if(e.touches.length===2){ const d=getDist(e.touches); if(pinch>0){ let ns=pinchScale*(d/pStart); if(ns<1) ns=1; if(ns>8) ns=8; lbScale=ns; clamp(); apply(); lbMoved=true; } }
    else if(e.touches.length===1){ const dx=e.touches[0].clientX-startX, dy=e.touches[0].clientY-startY;
      if(Math.abs(dx)>5||Math.abs(dy)>5) lbMoved=true;
      lbTx=tx0+dx; lbTy=ty0+dy; clamp(); apply(); }
  }, {passive:false});
  v.addEventListener('touchend', e=>{ if(e.touches.length<2) pinch=0;
    if(!lbMoved && e.changedTouches && e.changedTouches[0]){ if((Date.now()-t0)<350){ closeLightbox(); } }
  }, {passive:false});
  // 桌面
  v.onclick=e=>{ if(!lbMoved){ closeLightbox(); } lbMoved=false; };
  v.ondblclick=e=>{ e.preventDefault(); lbScale=lbScale>1.3?1:2; apply(); };
  v.onwheel=e=>{ e.preventDefault(); lbScale=lbScale*(e.deltaY<0?1.15:0.87); if(lbScale<1)lbScale=1; if(lbScale>8)lbScale=8; apply(); };
}
function closeLightbox(fromBack){

  v.classList.add('closing');

}
function getDist(t){ return Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY); }
function lbZoom(f){ lbScale=lbScale*f; if(lbImg) lbImg.style.transform='translate(-50%,-50%) scale('+lbScale+')'; }
function lbReset(){ lbScale=1; if(lbImg){ lbImg.style.transform='translate(-50%,-50%) scale(1)'; lbImg.style.left='50%'; lbImg.style.top='50%'; } }

let settingsView='list'; let editingProvider=null; let provSearch='';
let _setViewMode=null, _setAnimToken=0;
function swapSettingsView(box, newEl, forward){
  const oldEl = box.firstElementChild;
  if(!oldEl){ box.innerHTML=''; box.appendChild(newEl); return; }
  // 过渡期间锁定容器高度, 避免塌陷导致页面抽动
  box.style.position='relative';
  box.style.height = oldEl.offsetHeight + 'px';
  box.style.overflow='hidden';
  const ABS = function(el){ el.style.position='absolute'; el.style.top='0';
    el.style.left='0'; el.style.right='0'; el.style.width='100%'; };
  const release = function(){
    box.style.position=''; box.style.height=''; box.style.overflow='';
    newEl.style.cssText='';
  };
  if(forward){
    // 进二级页: 新页从右滑入, 盖在列表上(列表不动)
    ABS(newEl); newEl.style.zIndex='2';
    box.appendChild(newEl);
    newEl.style.animation='swSlideIn .26s cubic-bezier(.22,.61,.36,1)';
    setTimeout(function(){ release(); if(oldEl.parentNode) oldEl.remove(); }, 280);
  }else{
    // 返回: 当前页向右滑出, 露出下面的列表
    ABS(oldEl); oldEl.style.zIndex='2';
    box.insertBefore(newEl, oldEl);
    oldEl.style.animation='swSlideOut .24s cubic-bezier(.22,.61,.36,1) forwards';
    setTimeout(function(){ release(); if(oldEl.parentNode) oldEl.remove(); }, 260);
  }
}

/* ---------- 安全区同步(Capacitor 8.3+ 注入 --safe-area-inset-*) ---------- */
function readInset(name){
  try{
    const cs = getComputedStyle(document.body);
    let v = (cs.getPropertyValue(name) || '').trim();
    if(!v){ v = (getComputedStyle(document.documentElement).getPropertyValue(name) || '').trim(); }
    return v || '0px';
  }catch(e){ return '0px'; }
}
function syncInsets(){
  const t = readInset('--safe-area-inset-top');
  const b = readInset('--safe-area-inset-bottom');
  try{
    document.documentElement.style.setProperty('--sat', t);
    document.documentElement.style.setProperty('--sab', b);
  }catch(e){}
  window.__insets = { top:t, bottom:b };
  return window.__insets;
}

/* ---------- 从旧版(Termux 网关)导入配置 ---------- */
// APK 是全新存储, 读不到网页版的数据。若手机上的 Termux 网关还在跑, 可一键搬过来。
const OLD_GW = 'http://127.0.0.1:8765';
async function importFromGateway(){
  const note = document.getElementById('importNote');
  const set = function(msg, ok){ if(note){ note.innerHTML = (ok!==false?icon('check'):icon('x')) + ' ' + esc(msg); } };
  set('正在连接旧网关…');
  const j = async function(url){
    const r = await fetch(url);
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  };
  try{
    const cfg = await j(OLD_GW + '/api/config');
    const prefs = await j(OLD_GW + '/api/prefs').catch(function(){ return {}; });
    const sett = await j(OLD_GW + '/api/settings').catch(function(){ return { providers:{} }; });

    if(!cfg || !Object.keys(cfg).length) { set('旧网关里没有配置内容'); return; }

    // 1) 配置
    await jput('/api/config', cfg);
    // 2) Key(逐个取明文; 旧网关限制仅本机可读 —— App 正是本机)
    const keys = {};
    for(const p of Object.keys(cfg)){
      try{ const r = await j(OLD_GW + '/api/key?provider=' + encodeURIComponent(p)); if(r && r.key) keys[p]=r.key; }catch(e){}
    }
    if(Object.keys(keys).length) await jpost('/api/settings', { keys: keys });
    // 3) 偏好(含优化系统提示词)
    let prefsN = 0;
    if(prefs && Object.keys(prefs).length){
      await jput('/api/prefs', prefs);
      if(prefs.opt_prompt){
        // 直接落到前端读取的那把 key 上, 保证立刻生效
        try{ localStorage.setItem(optStorageKey(), prefs.opt_prompt); prefsN = 1; }catch(e){}
      }
    }
    // 4) 刷新界面
    try{ MODELS = await jget('/api/models'); fillProviders(); onProviderChange(); buildChatOptions(); }catch(e){}
    await loadKeyStatus();
    try{ $('optPrompt').value = loadOptPrompt(); }catch(e){}
    renderSettings(true);
    set('导入完成：' + Object.keys(cfg).length + ' 个提供方 · '
        + Object.keys(keys).length + ' 个 Key' + (prefsN ? ' · 优化提示词已恢复' : ''));
  }catch(e){
    set('导入失败：' + (e && e.message || e) + '（需要手机上 Termux 里的网关正在运行）', false);
  }
}

  b.title = on ? '隐藏' : '显示原文';
}
function _toMasked(key){
  const inp=document.getElementById('pkey_'+key); if(!inp) return;
  if(HAS_KEY[key]){ inp.type='password'; inp.value=KEY_MASK; inp.dataset.state='masked'; inp.dataset.masked='1'; }
  else { inp.type='password'; inp.value=''; inp.dataset.state=''; inp.dataset.masked=''; }
  _setEye(key, false);
}
async function toggleKeyVis(key){
  const inp=document.getElementById('pkey_'+key); if(!inp) return;
  const st=inp.dataset.state||'';
  if(st==='revealed'){ _toMasked(key); return; }        // 再看一次=收起
  if(st==='edit' || !HAS_KEY[key]){                     // 正在编辑/没存过 -> 只切明文
    const show=(inp.type==='password');
    inp.type = show ? 'text' : 'password';
    _setEye(key, show);
    return;
  }
  // 掩码态 + 已存 Key -> 拉取真正的 Key 原文
  const b=document.getElementById('peye_'+key);
  if(b) b.disabled=true;
  try{
    let k=KEY_CACHE[key];
    if(!k){ const r=await jget('/api/key?provider='+encodeURIComponent(key)); k=(r&&r.key)||''; KEY_CACHE[key]=k; }
    if(!k){ toast('该服务方还没有保存 Key'); return; }
    inp.value=k; inp.type='text'; inp.dataset.state='revealed'; inp.dataset.masked='';
    _setEye(key, true);
  }catch(e){ toast('读取失败: '+(e.message||e)); }
  finally{ if(b) b.disabled=false; }
}
function bindKeyField(card, key){
  const inp=card.querySelector('#pkey_'+key); if(!inp) return;
  if(keyDraft[key]){ inp.value=keyDraft[key]; inp.type='password'; inp.dataset.state='edit'; }
  else if(HAS_KEY[key]){ inp.value=KEY_MASK; inp.type='password'; inp.dataset.state='masked'; inp.dataset.masked='1'; }
  else { inp.dataset.state=''; }
  inp.addEventListener('focus', function(){
    if(inp.dataset.state==='masked'){          // 开始输入就清掉假黑点
      inp.value=''; inp.dataset.masked=''; inp.dataset.state='edit'; keyDraft[key]='';
      if(inp.type==='password'){ inp.type='text'; _setEye(key,true); }   // 编辑时明文便于核对
    } else if(inp.dataset.state==='revealed'){
      inp.dataset.state='edit'; keyDraft[key]=inp.value;                 // 基于原文修改
    }
  });
  inp.addEventListener('input', function(){
    inp.dataset.masked=''; inp.dataset.state='edit'; keyDraft[key]=inp.value;
  });
  const btn=card.querySelector('#peye_'+key);
  if(btn) btn.addEventListener('click', function(e){ e.preventDefault(); toggleKeyVis(key); });
}
function resetKeyField(key){
  delete KEY_CACHE[key];
  const inp=document.getElementById('pkey_'+key);
  if(inp){ delete keyDraft[key]; inp.dataset.masked=''; _toMasked(key); }
}

function providerCard(key){
  const p=CONFIG[key];
  const card=document.createElement('div'); card.className='pcard';
  card.innerHTML=`<div class="phead"><b id="pname_${key}">${esc(provName(key))}</b>
    <button class="btn ghost" onclick="delProvider('${key}')" title="删除服务方">${icon('trash')}</button></div>
    <label>提供方名称</label>
    <input type="text" id="plabel_${key}" value="${esc(p.label||'')}" placeholder="服务方名称（如 中转 / ComfyUI）" oninput="document.getElementById('pname_${key}').textContent=this.value||'未命名'; CONFIG['${key}'].label=this.value">
    <label>Base URL</label>
    <input type="text" id="pbase_${key}" value="${esc(p.base_url||'')}" placeholder="https://api.example.com/v1" oninput="CONFIG['${key}'].base_url=this.value">
    <label>API Key</label>
    <div class="keywrap">
      <input type="password" id="pkey_${key}" placeholder="留空则不修改" autocomplete="off" spellcheck="false">
      <button type="button" class="eyebtn" id="peye_${key}" title="显示">${icon('eye')}</button>
    </div>

    ${consoleLink(key)}
    <div class="sect">
      <h4>连接与检测</h4>
      <div class="tools">
        <button class="btn small" id="tb_det_${key}" onclick="detect('${key}')">${icon('search')}检测模型</button>
        <button class="btn small" id="tb_diag_${key}" onclick="diagnose('${key}')">${icon('pulse')}诊断</button>
        <button class="btn small" id="tb_bg_${key}" onclick="bgTest('${key}')">${icon('droplet')}透明图检测</button>
      </div>
      <div id="tool_${key}" class="toolpanel hide"></div>
    </div>

    ${modelSection(key,'image_models','生图模型')}
    ${modelSection(key,'chat_models','文本模型')}
`;
  const pk=card.querySelector('#pkey_'+key); if(pk && keyDraft[key]) pk.value=keyDraft[key];
  bindKeyField(card, key);
  renderList(key,'image_models',card.querySelector('#imglist_'+key));
  renderList(key,'chat_models',card.querySelector('#chatlist_'+key));
  fillDetDropdown(key, card);
  // chips 上的「+生图 / +文本」用事件委托, 避免 id 里特殊字符的转义问题
  const tp=card.querySelector('#tool_'+key);
  tp.addEventListener('click', function(e){
    const b=e.target.closest('[data-add]'); if(!b || b.hasAttribute('data-done')) return;
    addDet(key, b.getAttribute('data-add'), b.getAttribute('data-id'));
  });
  return card;
}
function fillDetDropdown(key, card){
  try{ var saved=JSON.parse(localStorage.getItem('sw_det_'+key)||'[]'); if(saved && saved.length) _det[key]=_det[key]&&_det[key].length?saved.concat(_det[key].filter(function(x){return saved.indexOf(x)<0;})):saved; }catch(e){}
  if(!_det[key]) _det[key]=[];
  ['image_models','chat_models'].forEach(type=>{
    const selId = type==='image_models'?'detImg_'+key:'detChat_'+key;
    const sel=(card?card.querySelector('#'+selId):null)||document.getElementById(selId); if(!sel) return;
    const cur=sel.value;
    sel.innerHTML='<option value="">'+( _det[key].length? ('（'+_det[key].length+' 个可选）') : '（检测后可下拉选择）')+'</option>';
    (_det[key]||[]).forEach(id=>{ const o=document.createElement('option'); o.value=id; o.textContent=id; sel.appendChild(o); });
    if(cur && (_det[key]||[]).indexOf(cur)>=0) sel.value=cur;
  });
}
function renderList(key,type,box){ if(!box) return; box.innerHTML='';
  const arr=CONFIG[key][type]||[];
  if(!arr.length){ const e=document.createElement('div'); e.className='small-note'; e.style.margin='0';
    e.textContent='暂无模型 —— 点「检测模型」后直接选，或点「手动」自己填'; box.appendChild(e); return; }
  arr.forEach((m,i)=>{ const row=document.createElement('div'); row.className='mrow';
    row.innerHTML=`<input type="text" class="mid" data-id value="${esc(m.id||'')}" placeholder="模型ID" oninput="CONFIG['${key}']['${type}'][${i}].id=this.value">
      <input type="text" data-label value="${esc(m.label||'')}" placeholder="显示名（可空）" oninput="CONFIG['${key}']['${type}'][${i}].label=this.value">
      <button class="btn ghost del" onclick="removeModel('${key}','${type}',${i})" title="删除">${icon('trash')}</button>`;
    box.appendChild(row); }); }
function addModel(key,type){ (CONFIG[key][type]=CONFIG[key][type]||[]).push({id:'',label:''});
  refreshModelList(key,type);
  setTimeout(function(){ const box=document.getElementById((type==='image_models'?'imglist_':'chatlist_')+key);
    if(!box) return; const rows=box.querySelectorAll('.mrow'); const last=rows[rows.length-1];
    if(last){ const inp=last.querySelector('[data-id]'); if(inp) inp.focus(); } }, 40); }
function addModelFromDet(key,type){ const selId = type==='image_models'?'detImg_'+key:'detChat_'+key;
  const sel=document.getElementById(selId);
  if(!sel || !sel.value){ toast('请先在下拉里选一个模型（或点「检测模型」）'); return; }
  addDet(key, type, sel.value); }
function removeModel(key,type,i){ CONFIG[key][type].splice(i,1); refreshModelList(key,type); toolSet(key, detPanel(key)); }
function openEditor(key){
  settingsView='edit'; editingProvider=key; renderSettings(); navPush();
}
function addProvider(){ const k='custom'+Date.now(); CONFIG[k]={label:'',base_url:'',image_models:[],chat_models:[]}; openEditor(k);
  const el=document.getElementById('plabel_'+k); if(el){ el.scrollIntoView({behavior:'smooth'}); el.focus(); } }
async function delProvider(key){ if(!confirm('删除提供方 '+key+' ?')) return; delete CONFIG[key]; settingsView='list'; editingProvider=null; renderSettings(); navConsume();
  try{ await jput('/api/config',CONFIG); toast('已删除并保存'); MODELS=await jget('/api/models'); fillProviders(); onProviderChange(); buildChatOptions(); }catch(e){ toast('保存失败: '+e.message); } }
async function detect(key){
  const base=document.getElementById('pbase_'+key).value.trim();
  const api=currentKey(key);
  toolShow(key,'det','检测模型','<div class="small-note" style="margin:0"><span class="loader" style="width:14px;height:14px;border-width:2px"></span> 正在检测…</div>');
  try{ const d=await jpost('/api/detect',{provider:key,base_url:base,api_key:api||undefined});
    _det[key]=d.models||[];
    try{ localStorage.setItem('sw_det_'+key, JSON.stringify(_det[key])); }catch(e){}
    fillDetDropdown(key);
    if(_det[key].length){ toolSet(key, detPanel(key)); }
    else { toolSet(key, '<div class="small-note" style="margin:0">'+esc(d.message||'未返回模型（该中转可能不支持 /models，请用「手动」添加，或点「诊断」验证）')+'</div>'); }
  }catch(e){
    const ctx = '服务方=' + key + ' · ' + (api ? '使用输入框里的 Key' : '使用已保存的 Key');
    toolSet(key,'<div class="small-note" style="margin:0">检测失败: '+esc(e.message)+'</div>'
      +'<div class="small-note" style="margin:4px 0 0;opacity:.7">'+esc(ctx)+'</div>');
  } }
async function bgTest(key){
  toolShow(key,'bg','透明背景检测','<div class="small-note" style="margin:0"><span class="loader" style="width:14px;height:14px;border-width:2px"></span> 正在逐个模型试透明背景（每个模型 2 次请求，可能耗时 1~3 分钟）…</div>');
  try{
    const d=await jpost('/api/bgtest',{provider:key},600000);
    let html='';
    const okCell=(r)=>{
      const isOk=(r.verdict==='支持');
      const col=isOk?'var(--acc2)':'var(--mut)';
      const ic=isOk?icon('check'):(r.ok?icon('x'):icon('x'));
      const v='<span style="display:inline-flex;align-items:center;gap:3px;color:'+col+'">'+ic+esc(r.verdict||'?')+'</span>';
      let extra='';
      if(r.ok && r.info && r.info.checked){
        const pct=r.info.sampled? Math.round(r.info.transparent/r.info.sampled*100):0;
        extra='<div style="font-size:11px;color:var(--mut)">'+r.info.w+'×'+r.info.h+' · 透明像素约 '+pct+'%</div>';
      }
      if(!r.ok && r.error) extra='<div style="font-size:11px;color:var(--mut)">'+esc(r.error.slice(0,90))+'</div>';
      return '<td style="padding:8px 6px;vertical-align:top"><b>'+v+'</b>'+extra+'</td>';
    };
    html+='<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px">'
      +'<tr style="text-align:left;color:var(--mut);font-size:12px"><th style="padding:6px">模型</th><th style="padding:6px">文生图</th><th style="padding:6px">图生图(带参考图)</th></tr>';
    (d.rows||[]).forEach(r=>{
      html+='<tr style="border-top:1px solid var(--line)"><td style="padding:8px 6px;font-size:12px">'+esc(r.model)+'</td>'
        +okCell(r.text2img)+okCell(r.img2img)+'</tr>';
    });
    html+='</table></div>';
    const s=d.summary||{}, total=s.total||0, t2i=s.text2img_ok||0, i2i=s.img2img_ok||0;
    let concl='';
    if(total && t2i===0 && i2i===0){
      const allSame=(d.rows||[]).every(r=>{
        const e=((r.text2img||{}).error||'')+' '+((r.img2img||{}).error||'');
        return /not supported/i.test(e);
      });
      concl = allSame
        ? '该中转<b>完全没有实现透明背景</b>：所有模型、两条路径都返回同一条「not supported」。这是中转侧不支持，不是模型能力或参数写法的问题，想要透明背景需要换支持的中转。'
        : '所有模型都不支持透明背景，可能是该中转未透传 background 参数。';
    } else if(t2i>0 && i2i===0){
      concl='文生图支持透明，但带参考图的图生图不支持 —— 中转的 edits 路径未实现透明背景。生成时若带参考图选透明，会自动回退为不透明。';
    } else if(t2i>0 || i2i>0){
      concl='部分模型/路径支持透明背景，见上表。不支持的会自动回退为不透明背景。';
    }
    html+='<div style="margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--card2);border:1px solid var(--line);font-size:13px;line-height:1.6">'
      +'文生图 '+esc(String(t2i))+'/'+esc(String(total))+'，图生图 '+esc(String(i2i))+'/'+esc(String(total))+'。'
      +(concl?'<br>'+concl:'')
      +'<br><span style="color:var(--mut);font-size:12px">提示：提示词里写「透明背景」没用 —— 模型只会画一个方格图案假装透明，那不是真 alpha 通道。</span>'
      +'</div>';
    toolSet(key, html);
  }catch(e){ toolSet(key, '<div class="small-note" style="margin:0">检测失败: '+esc(e.message)+'</div>'); }
}
function _chkRow(ok, name, detail, ms){
  var s='<div style="display:flex;gap:8px;align-items:baseline;padding:5px 0">'
    +'<span style="flex:none;display:inline-flex;color:'+(ok?'var(--acc2)':'var(--bad)')+'">'+icon(ok?'check':'x')+'</span>'
    +'<span style="flex:1;font-size:13px">'+esc(name)+'</span>'
    +(ms!=null?'<small style="flex:none;color:var(--mut)">'+ms+'ms</small>':'')+'</div>';
  if(detail) s+='<div class="small-note" style="margin:0 0 6px 22px;font-size:12px">'+_escMulti(detail)+'</div>';
  return s;
}
// 多行详情: 先转义, 再把换行/\n/<br> 统一成真的换行标签(不做 html 注入)
function _escMulti(t){
  var x = esc(String(t));
  x = x.replace(/(&lt;br&gt;|\\n|\r?\n)/g, '<br>');
  return x;
}
function _secTitle(t){ return '<div style="font-size:12px;color:var(--mut);margin:10px 0 2px;font-weight:600">'+esc(t)+'</div>'; }

/* 合并诊断: ① 接口与 Key(连接测试) + ② 网络传输(网络诊断) */
async function diagnose(key){
  toolShow(key,'diag','诊断','<div class="small-note" style="margin:0"><span class="loader" style="width:14px;height:14px;border-width:2px"></span> 正在诊断：接口与 Key…</div>');
  var html='';
  // ① 接口与 Key
  var baseEl=document.getElementById('pbase_'+key);
  var keyEl=document.getElementById('pkey_'+key);
  var base=(baseEl&&baseEl.value||'').trim();
  var api=currentKey(key);
  var cm=(CONFIG[key].chat_models||[])[0], im=(CONFIG[key].image_models||[])[0];
  var model=(cm&&cm.id)||(im&&im.id)||null;
  html+=_secTitle('① 接口与 Key');
  try{
    var r=await jpost('/api/test',{provider:key,base_url:base,api_key:api||undefined,model:model||undefined});
    html+=_chkRow(!!r.ok, '接口连通 / Key 有效', String(r.message||'').replace(/\n/g,'<br>'));
  }catch(e){
    html+=_chkRow(false, '接口连通 / Key 有效', e.message);
  }
  toolSet(key, html+'<div class="small-note" style="margin:0"><span class="loader" style="width:14px;height:14px;border-width:2px"></span> 正在测网络传输（大流量）…</div>');
  // ② 网络传输
  try{
    var d=await jpost('/api/netdiag',{mb:2,provider:key},300000);
    html+=_secTitle('② 网络传输（与 Key 无关，测代理/大包）');
    (d.tests||[]).forEach(function(t){ html+=_chkRow(t.ok, t.name, t.detail, t.ms); });
    if(d.advice) html+='<div style="margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--card2);border:1px solid var(--line);font-size:13px;line-height:1.6">'+esc(d.advice)+'</div>';
  }catch(e){
    html+=_secTitle('② 网络传输（与 Key 无关，测代理/大包）');
    html+=_chkRow(false, '网络测试', e.message);
  }
  toolSet(key, html);
}
async function saveProvider(key){
  try{
    const g = function(id){ const el=document.getElementById(id); return el ? el : null; };
    if(!CONFIG[key]) throw new Error('提供方不存在: '+key);
    const labEl=g('plabel_'+key), baseEl=g('pbase_'+key);
    if(labEl) CONFIG[key].label = labEl.value.trim() || (CONFIG[key].label || '');
    if(baseEl) CONFIG[key].base_url = baseEl.value.trim();
    CONFIG[key].image_models = readList(key,'image_models');
    CONFIG[key].chat_models  = readList(key,'chat_models');

    // 取要提交的 Key: 只看值, 不依赖 state; 掩码(一串•)不算
    const inp = g('pkey_'+key);
    let v = inp ? String(inp.value || '').trim() : '';
    if(v && /^[•\u2022]+$/.test(v)) v = '';                 // 全是黑点 = 掩码
    v = v || String(keyDraft[key] || '').trim();

    await jput('/api/config', CONFIG);
    let keyMsg = '';
    if(v){
      await jpost('/api/settings', { keys: (function(){ const o={}; o[key]=v; return o; })() });
      HAS_KEY[key] = true;
      delete keyDraft[key]; KEY_CACHE = {};
      if(inp){ inp.type='password'; inp.value=KEY_MASK; inp.dataset.masked='1'; inp.dataset.state='masked'; }
      _setEye(key, false);
      keyMsg = ' · Key 已保存';
    } else if(HAS_KEY[key]){
      keyMsg = ' · Key 未改动';
    } else {
      keyMsg = ' · 未填 Key';
    }
    MODELS = await jget('/api/models');
    fillProviders(); onProviderChange(); buildChatOptions();
    toast('已保存' + keyMsg);
  }catch(e){
    toast('保存失败: ' + (e && e.message || e));
    console.error('saveProvider', e);
  }
}
function readList(key,type){ const box = type==='image_models'?document.getElementById('imglist_'+key):document.getElementById('chatlist_'+key);
  if(!box) return []; const rows=box.querySelectorAll('.mrow'); const out=[];
  rows.forEach(r=>{ const id=r.querySelector('[data-id]').value.trim(); const lb=r.querySelector('[data-label]').value.trim(); if(id) out.push({id,label:lb||id}); });
  return out; }

function esc(s){ return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
document.addEventListener('click', function(e){
  if(!document.querySelector('.provmenu')) return;
  if(e.target.closest('.provmenu') || e.target.closest('.prov-menu')) return;
  closeProvMenu();
});
loadPrefs();
init();
</script>
</body>
</html>
