<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Seedream Web</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root[data-theme="dark"]{
    --bg:#0f1115;--card:#1a1d24;--card2:#22262f;--line:#2c313b;
    --txt:#e8ebf0;--mut:#9aa3b2;--acc:#4c8dff;--acc2:#6ee7b7;--bad:#ff6b6b;--deep:#141720;
  }
  :root[data-theme="light"]{
    --bg:#f4f5f8;--card:#ffffff;--card2:#f0f1f5;--line:#dde1e8;
    --txt:#1b1f27;--mut:#6a7280;--acc:#2563eb;--acc2:#0d9488;--bad:#dc2626;--deep:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg)}
  body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--txt);-webkit-tap-highlight-color:transparent;
       transition:background .25s,color .25s}
  .app{display:flex;flex-direction:column;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);
         backdrop-filter:blur(8px);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
  header h1{font-size:18px;margin:0;display:flex;align-items:center;gap:8px}
  header h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--acc2);display:inline-block}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;text-align:center;line-height:1;width:38px;height:38px;
        border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:10px;cursor:pointer}
  .icon-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;margin:auto}
  main{flex:1;padding:12px 14px 120px;width:100%;box-sizing:border-box;}
  .page{display:none}
  .page.active{display:block}
  .btn{border:1px solid var(--line);background:var(--card);color:var(--txt);padding:11px 14px;
       border-radius:10px;font-size:14px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .btn:hover{border-color:var(--acc)}
  .btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
  .btn.small{padding:7px 10px;font-size:12px}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--bad);padding:2px}
  .btn.ghost svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .btn:disabled{opacity:.55;cursor:not-allowed;pointer-events:none}
  .btn:disabled .spin{border-top-color:var(--acc)}
  .loader{width:22px;height:22px;border:3px solid color-mix(in srgb,var(--acc) 30%,transparent);border-top-color:var(--acc);border-radius:50%;animation:sp .9s linear infinite;flex:none;display:inline-block}
  @keyframes sp{to{transform:rotate(360deg)}}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 14px}
  label{display:block;font-size:12px;color:var(--mut);margin:10px 0 6px}
  input[type=text],input[type=password],textarea,select{width:100%;background:var(--card2);color:var(--txt);
       border:1px solid var(--line);border-radius:10px;padding:11px;font-size:15px;font-family:inherit}
  textarea{min-height:88px;resize:vertical}
  textarea::-webkit-resizer{background:transparent}
  textarea{scrollbar-width:thin}
  /* textarea 右下角拖拽手柄(简洁、可拖) */
  .ta-wrap{position:relative;display:block}
  .ta-wrap textarea{display:block;resize:vertical}
  .ta-grip{position:absolute;right:0;bottom:0;width:28px;height:28px;
        display:flex;align-items:flex-end;justify-content:flex-end;opacity:.45;transition:.15s;pointer-events:none;
        background:
          linear-gradient(135deg, transparent 50%, var(--line) 50%) 100% 100%/7px 7px no-repeat,
          linear-gradient(135deg, transparent 50%, var(--line) 50%) 100% 100%/11px 11px no-repeat;
        }
  .ta-wrap:hover .ta-grip{opacity:.8}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row > *{flex:1;min-width:140px}
  .toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
  .opt-sub{font-size:11px;color:var(--mut);line-height:1.35;margin-top:2px}
  .switch{position:relative;width:50px;height:28px;flex:none}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:var(--line);border-radius:20px;cursor:pointer;transition:.2s}
  .slider:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
  .switch input:checked + .slider{background:var(--acc2)}
  .switch input:checked + .slider:before{transform:translateX(22px)}
  .refs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .ref{position:relative;width:74px;height:74px;border-radius:10px;overflow:hidden;border:1px solid var(--line);
       user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
  .ref img{width:100%;height:100%;object-fit:cover;cursor:pointer;pointer-events:none}
  .ref .del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);border:none;color:#fff;
        width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:15px;padding:0;line-height:1;
        display:flex;align-items:center;justify-content:center}
  .ref .del:hover{background:rgba(0,0,0,.85)}
  .ref .idx{position:absolute;left:2px;bottom:2px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:1px 5px;border-radius:6px}
  .ref{display:flex;flex-direction:column;width:96px;height:auto;border:1px solid var(--line);border-radius:8px;padding:4px}
  .ref .thumb{position:relative;width:100%;height:88px;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--card2)}
  .ref .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .ref .thumb .idx{position:absolute;left:3px;bottom:3px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:1px 5px;border-radius:6px}
  .ref .thumb .del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);border:none;color:#fff;width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:15px;padding:0;line-height:1;display:flex;align-items:center;justify-content:center}
  .ref select.refrole{margin-top:4px;width:100%;font-size:11px;padding:3px 4px;border:1px solid var(--line);border-radius:6px;background:var(--card2);color:var(--txt)}

  .ref.add{border-style:dashed;background:transparent}
  .drag-ghost{opacity:.4;transform:scale(.94)}
  #refs .ref{transition:transform .18s ease}
  .canvas{min-height:64px;border:1px dashed var(--line);border-radius:10px;display:flex;align-items:center;
        justify-content:center;color:var(--mut);font-size:13px;cursor:pointer;padding:12px;gap:8px}
  .canvas svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .canvas:hover{border-color:var(--acc)}
  .results{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
  .res{border-radius:12px;overflow:hidden;border:1px solid var(--line);position:relative;background:#000}
  .res img{width:100%;display:block;cursor:zoom-in}
  .res a{display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;
        background:var(--card2);color:var(--acc2);text-decoration:none;font-size:13px;font-weight:500;
        border-top:1px solid var(--line)}
  .res a:hover{background:var(--card)}
  .res a svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .hist{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  .hitem{border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative;background:#000;cursor:pointer}
  .hitem img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
  .hitem .meta{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:4px;padding:5px 6px;background:rgba(0,0,0,.55)}
  .hitem .meta span{font-size:10px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .hitem .meta small{font-size:11px;color:var(--acc2);flex:none}
  .hitem .meta .btn.ghost{color:#fff}
  .hitem.hsel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
  .hmark{position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;z-index:5;pointer-events:none}

  details{border:1px solid var(--line);border-radius:10px;padding:0 10px;margin-top:10px;background:var(--card2)}
  details summary{cursor:pointer;padding:10px 0;font-size:13px;color:var(--mut);list-style:none;display:flex;align-items:center;gap:6px}
  details summary::-webkit-details-marker{display:none}
  details summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(-45deg);margin-right:4px;transition:.2s}
  details[open] summary::before{transform:rotate(45deg)}
  /* 底部导航 */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:color-mix(in srgb,var(--bg) 94%,transparent);
        backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;
        color:var(--mut);font-size:11px;cursor:pointer;padding:6px 0}
  .tabbar button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tabbar button.active{color:var(--acc)}
  /* 设置页 provider 列表(二级) */
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 14px;position:relative}
  .editbar{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;justify-content:space-between;align-items:center;gap:10px;height:64px;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line);box-sizing:border-box}
  .editbar .icon-btn{box-shadow:none;width:40px;height:40px}
  .editbar-spacer{height:64px}

  .provlist-top{display:flex;gap:8px;margin-bottom:12px}
  .provlist-top input{flex:1;margin:0}
  .provlist-top .btn{flex:none;min-height:44px}
  .provrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
  .provrow:hover{border-color:var(--acc)}
  .prov-avatar{width:46px;height:46px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--acc);flex:none}
  .prov-info{flex:1;min-width:0}
  .prov-name{font-size:16px;font-weight:600;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .prov-badges{display:flex;gap:6px;margin-top:5px}
  .prov-badges .badge{font-size:11px;color:var(--mut);background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:2px 8px}
  .prov-badges .badge.on{color:var(--acc2);background:color-mix(in srgb,var(--acc2) 12%,var(--card2))}
  .prov-menu{background:none;border:none;color:var(--mut);font-size:20px;cursor:pointer;width:34px;height:34px;flex:none;line-height:1}
  .prov-menu:hover{color:var(--bad)}
  /* 下拉提示灰 + 对齐(与输入框同款: 同背景/内边距/高度) */
  .addbar select{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card2);font-size:15px;padding:11px;color:var(--txt)}
  .addbar select.sel-hint{color:var(--mut)}
  .addbar select.sel-hint.filled{color:var(--txt)}
  .addbar .btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center}
  .addbar.stretch{align-items:stretch}
  .addbar.stretch select,.addbar.stretch .btn{height:auto;align-self:stretch}
  /* ⋮ 菜单 */
  .provmenu{position:fixed;z-index:120;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;min-width:150px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .provmenu div{padding:13px 18px;font-size:15px;cursor:pointer;border-radius:8px;color:var(--txt);margin:2px 0}
  .provmenu div:hover{background:var(--card2)}
  .provmenu div.danger{color:var(--bad)}
  .phead{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .phead b{font-size:16px}
  .mlist{display:flex;flex-direction:column;gap:8px}
  .mrow{display:flex;gap:8px;align-items:center}
  .mrow input{flex:1}
  .mrow input.mid{flex:2}
  .mrow .del{width:32px;height:32px;flex:none}
  .det{margin-top:8px;padding:10px;border:1px dashed var(--line);border-radius:10px}
  .addbar{display:flex;gap:8px;margin-top:10px;align-items:center}
  .addbar.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:stretch}
  .addbar.actions .btn{min-height:44px;white-space:nowrap;padding:7px 8px;overflow:hidden}
  .addbar.actions .span2{grid-column:1 / -1}
  .small-note{font-size:11px;color:var(--mut);margin-top:6px}
  .toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--card2);
        border:1px solid var(--line);padding:11px 18px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:.25s;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .toast.show{opacity:1}
  .hide{display:none !important}

  /* ---------- 动效 ---------- */
  @keyframes swFadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes swFadeIn{from{opacity:0}to{opacity:1}}
  @keyframes swFadeOut{from{opacity:1}to{opacity:0}}
  @keyframes swSlideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
  @keyframes swSlideOut{from{transform:translateX(0)}to{transform:translateX(100%)}}
  @keyframes swPopIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
  @keyframes swPopOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.9)}}
  .page.active{animation:swFadeUp .24s cubic-bezier(.22,.61,.36,1)}
  .hitem{transition:transform .16s ease}
  .hitem:active{transform:scale(.975)}
  .hitem.anim{animation:swFadeUp .3s cubic-bezier(.22,.61,.36,1) both}
  .res img{transition:transform .2s ease}
  .res img:active{transform:scale(.985)}
  .provrow{transition:transform .16s ease}
  .provrow:active{transform:scale(.985)}
  .provmenu{animation:swPopIn .16s cubic-bezier(.22,.61,.36,1);transform-origin:top right}
  .provmenu.closing{animation:swPopOut .14s ease forwards}
  #viewer{animation:swSlideIn .26s cubic-bezier(.22,.61,.36,1)}
  #viewer.closing{animation:swSlideOut .22s cubic-bezier(.22,.61,.36,1) forwards}
  #lightbox{animation:swFadeIn .18s ease}
  #lightbox.closing{animation:swFadeOut .16s ease forwards}
  .editbar,.pcard{animation:swFadeUp .24s cubic-bezier(.22,.61,.36,1)}
  @media (prefers-reduced-motion: reduce){
    .page.active,.hitem.anim,.provmenu,#viewer,#lightbox,.editbar,.pcard{animation:none!important}
    .hitem,.res img,.provrow{transition:none!important}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1><span class="dot"></span>Seedream</h1>
    <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="切换主题"></button>
  </header>

  <main>
    <!-- 生成页 -->
    <section id="page-generate" class="page active">
      <div class="card">
        <div class="row">
          <div><label>服务方</label><select id="provider" onchange="onProviderChange()"></select></div>
          <div><label>生图模型</label><select id="imageModel" onchange="onImageModelChange()"></select></div>
        </div>
        <div id="modelOptions"></div>
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <label style="margin:0;font-size:13px;color:var(--txt)">提示词</label>
          <div style="display:flex;gap:8px;align-items:center">
            <button class="btn small" id="undoOptBtn" style="display:none" onclick="toggleVersion()">↩ 退回原输入</button>
            <button class="btn small" onclick="clearDraftUI()">清空</button>
          </div>
        </div>
        <div class="ta-wrap"><textarea id="prompt" placeholder="描述你想生成的画面…" style="margin-top:6px"></textarea><span class="ta-grip"></span></div>
        <div id="imgDescWrap" class="hide">
          <label>参考图特征描述（中文，可编辑）</label>
          <div class="ta-wrap"><textarea id="imgDesc" style="min-height:90px"></textarea><span class="ta-grip"></span></div>
        </div>
        <div class="row" style="margin-top:10px">
          <button class="btn" id="optBtn" onclick="optimizePrompt()">优化提示词</button>
          <button class="btn primary" onclick="generate()">生成图片</button>
        </div>
        <div id="optResult" class="small-note"></div>
        <div class="toggle" style="margin-top:8px">
          <div style="flex:1">
            <div style="font-size:13px">干净渲染</div>
            <div class="opt-sub">抑制碎影/色斑/串色/噪点，自动追加干净渲染约束</div>
          </div>
          <label class="switch"><input type="checkbox" id="cleanRender"><span class="slider"></span></label>
        </div>
        <details id="optSettings">
          <summary>提示词优化设置</summary>
          <div id="chatWrap" style="padding-bottom:10px">
            <label>优化文本模型</label>
            <select id="chatModel"></select>
            <div class="row" style="margin-top:8px">
              <div><label>优化流程</label>
                <select id="optFlow"><option value="one" selected>一段式（合并优化）</option><option value="two">两段式（先提取图片特征）</option></select></div>
            </div>
            <div class="toggle" style="margin-top:8px">
              <div style="font-size:13px">识别参考图并按图优化（需视觉模型）</div>
              <label class="switch"><input type="checkbox" id="useVision" checked><span class="slider"></span></label>
            </div>
            <div class="toggle" style="margin-top:8px">
              <div style="flex:1">
                <div style="font-size:13px">关闭思考模式（大幅提速）</div>
                <div class="opt-sub">DeepSeek / Seed 等推理模型跳过思维链，只输出结果</div>
              </div>
              <label class="switch"><input type="checkbox" id="noThinking" checked><span class="slider"></span></label>
            </div>
            <label>优化系统提示词（可编辑）</label>
            <textarea id="optPrompt" style="min-height:100px"></textarea>
            <div style="text-align:right;min-height:16px;margin-top:4px">
              <span id="optSaveState" style="font-size:12px;color:var(--acc2);opacity:0;transition:opacity .2s">已保存</span>
            </div>
          </div>
        </details>
      </div>

      <div class="card">
        <label>参考图（最多 10 张，拖拽可排序，顺序即 #1 #2 …）</label>
        <input type="file" id="fileInput" accept="image/*" multiple class="hide">
        <div class="refs" id="refs"></div>
        <div class="toggle" style="margin-top:6px">
          <div style="flex:1">
            <div style="font-size:13px">参考图二次压缩</div>
            <div class="opt-sub">开启后参考图更小更快，关闭保留细节</div>
          </div>
          <label class="switch"><input type="checkbox" id="compress"><span class="slider"></span></label>
        </div>
        <div class="addbar" style="margin-top:8px;align-items:stretch">
          <input type="text" id="refUrl" placeholder="粘贴图片 URL 添加为参考图" style="flex:1;margin:0">
          <button class="btn" style="flex:none;padding:0 18px;display:inline-flex;align-items:center" onclick="addRefUrl()">添加</button>
        </div>
      </div>

      <div class="card">
        <label>生成结果</label>
        <div class="results" id="results"><div class="small-note">尚未生成</div></div>
      </div>
    </section>

    <!-- 设置页 -->
    <section id="page-settings" class="page">
      <div id="provEditor"></div>
    </section>

    <!-- 记录页 -->
    <section id="page-history" class="page">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <label style="margin:0;font-size:14px;color:var(--txt);white-space:nowrap">生成记录</label>
          <button class="btn small" id="histSelectBtn" type="button">多选</button>
        </div>
        <div id="histSelBar" class="hide" style="display:flex;align-items:center;gap:8px;margin-bottom:10px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px">

你必须根据具体任务动态决定 Prompt 的结构和详细程度。不要机械套用固定模板，也不要为了形式完整而强行加入与任务无关的栏目。人物图应自然覆盖身份、外观、姿态、表情、服装、场景、构图、光影和渲染；产品图应重点覆盖形体、材质、表面状态、光线、摄影和背景；场景图应重点覆盖空间结构、建筑/环境、镜头、光线、材质和氛围；Logo、图标、平面设计等任务则应采用适合其类型的描述方式。结构必须服务于图像，而不是让图像服从模板。

当存在参考图时，先判断每张图提供的证据类型，例如 character identity、face、hair、clothing、pose、style、material、color 或 composition，并在最终 Prompt 中明确说明其用途。保持用户指定的身份特征、结构特征和关键设计，不要无意识混合不同参考图中的人物身份。除非用户要求复现，否则参考图默认用于提取视觉特征和风格证据，而不是复制其构图、裁切、姿势、背景或大面积色彩布局。用户当前明确指令优先于参考图中可能产生冲突的信息。

进行视觉补全时，只补充能够提高构图、空间、材质、光影、解剖、可读性或整体完成度的信息，不要为了\"丰富\"而增加随机装饰。任何新增元素都必须有视觉作用。若用户没有要求复杂背景、密集粒子、丰富纹理或大量装饰，默认保持克制。

建立明确的视觉细节层级：主体和关键特征获得最高精度，次要物体适度处理，环境和背景逐级简化。不要让角色、头发、水面、服装、地面、背景和粒子拥有相同的细节密度。对于动漫图尤其要避免大量随机发丝、碎裂线稿、过多衣服褶皱、密集纹理、碎片化阴影、水面随机高光、过量粒子、复杂背景和无意义的小物件。优先使用完整的大形状、成组的细节和少量有目的的微小元素。

function scrollToResults(){
  const r=$('results'); if(!r) return;
  const app=document.querySelector('.app');
  // .app 是内部滚动容器; 把 #results 滚动到可视区域
  const target=app||document.documentElement||document.body;
  const rect=r.getBoundingClientRect();
  const appRect=app?app.getBoundingClientRect():null;
  const baseY=appRect? appRect.top : 0;
  const top=(rect.top - baseY) + (app?app.scrollTop:0) - 90; // 留出顶栏
  try{ target.scrollTo({top:Math.max(0,top), behavior:'smooth'}); }
  catch(e){ target.scrollTop=Math.max(0,top); }
}

async function jget(u){ const r=await fetch(u); if(!r.ok) throw new Error(await r.text()); return r.json(); }
async function jpost(u,b,t){ return jreq('POST',u,b,t); }
async function jput(u,b){ return jreq('PUT',u,b); }
async function jreq(m,u,b,timeout){
  const limit=(timeout && timeout>0)?timeout:300000;
  const ctl=new AbortController(); const timer=setTimeout(()=>ctl.abort(), limit);
  try{ const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:JSON.stringify(b),signal:ctl.signal});
    const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.detail||JSON.stringify(d)); return d; }
  catch(e){ if(e && e.name==='AbortError') throw new Error('请求超时（超过 '+Math.round(limit/1000)+' 秒）。任务可能仍在后端进行，请在「记录」里查看。'); throw e; }
  finally{ clearTimeout(timer); } }

let _navDepth = 0, _navSilent = 0;
let CUR_TAB = 'generate';
function navPush(){ _navDepth++; try{ history.pushState({sw:_navDepth}, '', location.href); }catch(e){} }
function navBack(){ if(_navDepth>0){ try{ history.back(); }catch(e){} } }
function navConsume(){ if(_navDepth>0){ _navSilent++; try{ history.back(); }catch(e){} } }
// 关闭最上层视图; 返回 true = 已处理(不退出页面)
function closeTopmost(){
  var lb=document.getElementById('lightbox'); if(lb){ closeLightbox(true); return true; }
  var v=document.getElementById('viewer'); if(v){ closeViewer(true); return true; }
  var m=document.querySelector('.provmenu'); if(m){ closeProvMenu(true); return true; }
  if(CUR_TAB==='settings' && settingsView==='edit'){ settingsView='list'; editingProvider=null; renderSettings(); return true; }
  if(CUR_TAB!=='generate'){ switchTab('generate', true); return true; }
  return false;
}
window.addEventListener('popstate', function(){
  _navDepth = Math.max(0, _navDepth - 1);
  if(_navSilent > 0){ _navSilent--; return; }   // 程序化关闭时消费掉的状态
  closeTopmost();
});

function switchTab(name, fromNav){
  // 点「生成」tab 回主页: 交给返回栈处理, 保证状态一致
  if(fromNav !== true && name === 'generate' && CUR_TAB !== 'generate' && _navDepth > 0){
    navBack(); return;
  }
  var prev = CUR_TAB;
  var app=document.querySelector('.app');
  // 保存当前页滚动位置
  var cur=document.querySelector('.page.active'); if(cur && app){ pageScroll[cur.id]=app.scrollTop; }
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active', p.id==='page-'+name));
  document.querySelectorAll('.tabbar .tab').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  // 离开设置页时收起二级编辑页
  if(name !== 'settings' && settingsView === 'edit'){ settingsView='list'; editingProvider=null; }
  if(name==='settings') renderSettings();
  if(name==='history') loadHistory();
  if(name==='generate'){ buildChatOptions(); }
  // 恢复目标页滚动(首次进入=顶)
  if(app){ app.scrollTop = pageScroll['page-'+name] != null ? pageScroll['page-'+name] : 0; }
  CUR_TAB = name;
  if(fromNav === true) return;
  if(prev === 'generate' && name !== 'generate') navPush();
}

async function init(){
  dstep('0-start');
  applyTheme(); requestNotif();
  dstep('1-before-models');
  MODELS = await jget('/api/models'); dstep('2-models-ok n='+(MODELS?Object.keys(MODELS).length:'x'));
  CONFIG = await jget('/api/config'); dstep('3-config-ok n='+(CONFIG?Object.keys(CONFIG).length:'x'));
  fillProviders(); dstep('4-providers-filled');
  onProviderChange(); dstep('5-provider-change');
  buildChatOptions(); setupOptPrompt(); dstep('6-opt-setup');
  restoreDraft();
  // 恢复检测结果
  try{ Object.keys(localStorage).forEach(function(k){ if(k.indexOf('sw_det_')===0){ var key=k.slice(7); try{ _det[key]=JSON.parse(localStorage.getItem(k)||'[]'); }catch(e){} } }); }catch(e){}
  renderRefs(); loadHistory(); dstep('7-done');
  $('prompt').addEventListener('input', saveDraftDebounced);
  if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('/sw.js'); }catch(e){} }
  document.getElementById('optSettings').addEventListener('toggle', ()=>{ if(document.getElementById('optSettings').open) buildChatOptions(); });
  if(location.hash==='#history') switchTab('history');
}
function fillProviders(){ const p=$('provider'); p.innerHTML='';
  const keys=Object.keys(MODELS).filter(k=>{
    if(CONFIG[k] && CONFIG[k].enabled===false) return false;
    const conf=MODELS[k]; if(!conf) return false;

/* ---------- 参考图 ---------- */
function compressImage(file, maxEdge=2048, quality=0.95){
  return new Promise((resolve,reject)=>{ const rd=new FileReader();
    rd.onload=ev=>{ const img=new Image(); img.onload=()=>{ let w=img.width,h=img.height; const m=Math.max(w,h);
      if(m>maxEdge){ const r=maxEdge/m; w=Math.round(w*r); h=Math.round(h*r); }
      const c=document.createElement('canvas'); c.width=Math.max(1,w); c.height=Math.max(1,h);
      const ctx=c.getContext('2d'); ctx.imageSmoothingEnabled=true; ctx.drawImage(img,0,0,c.width,c.height);
      const isPng=/image\/png|image\/webp/.test(file.type);
      const type=isPng?'image/png':'image/jpeg';
      let url='';
      try{ url=c.toDataURL(type,quality); }catch(e){ url=''; }
      if(!url || url.length<40 || url.indexOf('data:image/')!==0){ reject(new Error('image_compress_failed')); return; }
      resolve(url); };
      img.onerror=()=>reject(new Error('image_decode_failed')); img.src=ev.target.result; };
    rd.onerror=()=>reject(new Error('read_failed')); rd.readAsDataURL(file); });
}

    try{ const u=await compressImage(f); refs.push({url:u, role:'auto'}); added++; }catch(err){ console.error(err); } }
  if(added) toast('已添加并压缩 '+added+' 张'); renderRefs(); e.target.value=''; };

function viewImage(src){
  let v=document.getElementById('lightbox');
  if(!v){ v=document.createElement('div'); v.id='lightbox';
    v.style.cssText='position:fixed;inset:0;z-index:200;background:#000;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;';
    document.body.appendChild(v); navPush(); }
  lbScale=1; lbTx=0; lbTy=0; lbMoved=false;
  v.innerHTML='<img id="lbImg" src="'+esc(src)+'" style="position:absolute;left:50%;top:50%;max-width:100vw;max-height:100vh;object-fit:contain;will-change:transform">';
  lbImg=document.getElementById('lbImg');
  function apply(){ const s=lbScale; lbImg.style.transform='translate(-50%,-50%) translate('+lbTx+'px,'+lbTy+'px) scale('+s+')'; }
  function clamp(){
    // 边界: 图片边缘不得离开视口(拖到边缘即停, 不出现黑边)
    const vw=v.clientWidth, vh=v.clientHeight;
    const r=lbImg.getBoundingClientRect(); // 含 scale 的实际显示尺寸
    const w=r.width, h=r.height;
    const maxX=Math.max(0,(w-vw)/2), maxY=Math.max(0,(h-vh)/2);
    if(lbTx>maxX) lbTx=maxX; if(lbTx<-maxX) lbTx=-maxX;
    if(lbTy>maxY) lbTy=maxY; if(lbTy<-maxY) lbTy=-maxY;
  }
  apply();
  let pinch=0, pinchScale=1, pStart=0, startX=0, startY=0, tx0=0, ty0=0, t0=0;
  v.addEventListener('touchstart', e=>{ e.preventDefault(); lbMoved=false; t0=Date.now();
    if(e.touches.length===2){ pinch=getDist(e.touches); pinchScale=lbScale; pStart=pinch; }
    else if(e.touches.length===1){ startX=e.touches[0].clientX; startY=e.touches[0].clientY; tx0=lbTx; ty0=lbTy; }
  }, {passive:false});
  v.addEventListener('touchmove', e=>{ e.preventDefault();
    if(e.touches.length===2){ const d=getDist(e.touches); if(pinch>0){ let ns=pinchScale*(d/pStart); if(ns<1) ns=1; if(ns>8) ns=8; lbScale=ns; clamp(); apply(); lbMoved=true; } }
    else if(e.touches.length===1){ const dx=e.touches[0].clientX-startX, dy=e.touches[0].clientY-startY;
      if(Math.abs(dx)>5||Math.abs(dy)>5) lbMoved=true;
      lbTx=tx0+dx; lbTy=ty0+dy; clamp(); apply(); }
  }, {passive:false});
  v.addEventListener('touchend', e=>{ if(e.touches.length<2) pinch=0;
    if(!lbMoved && e.changedTouches && e.changedTouches[0]){ if((Date.now()-t0)<350){ closeLightbox(); } }
  }, {passive:false});
  // 桌面
  v.onclick=e=>{ if(!lbMoved){ closeLightbox(); } lbMoved=false; };
  v.ondblclick=e=>{ e.preventDefault(); lbScale=lbScale>1.3?1:2; apply(); };
  v.onwheel=e=>{ e.preventDefault(); lbScale=lbScale*(e.deltaY<0?1.15:0.87); if(lbScale<1)lbScale=1; if(lbScale>8)lbScale=8; apply(); };
}

    };
    html+='<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px">'
      +'<tr style="text-align:left;color:var(--mut);font-size:12px"><th style="padding:6px">模型</th><th style="padding:6px">文生图</th><th style="padding:6px">图生图</th><th style="padding:6px">仅提示词</th></tr>';
    (d.rows||[]).forEach(r=>{
      html+='<tr style="border-top:1px solid var(--line)"><td style="padding:8px 6px;font-size:12px">'+esc(r.model)+'</td>'
        +okCell(r.text2img)+okCell(r.img2img)
        + (r.prompt_only ? okCell(r.prompt_only) : '<td style="padding:8px 6px;color:var(--mut);font-size:12px">—</td>')
        +'</tr>';
    });
    html+='</table></div>';
    const s=d.summary||{}, total=s.total||0, t2i=s.text2img_ok||0, i2i=s.img2img_ok||0, po=s.prompt_only_ok||0;
    let concl='';
    if(total && t2i===0 && i2i===0){
      const allSame=(d.rows||[]).every(r=>{
        const e=((r.text2img||{}).error||'')+' '+((r.img2img||{}).error||'');
        return /not supported/i.test(e);
      });
      concl = allSame
        ? '该中转<b>完全没有实现透明背景</b>：所有模型、两条路径都返回同一条「not supported」。这是中转侧不支持，不是模型能力或参数写法的问题。'
        : '所有模型都不支持透明背景，可能是该中转未透传 background 参数。';
      concl += po>0
        ? ' <b style="color:var(--acc2)">但「仅提示词」方式可行</b>：不传 background 参数、只在提示词里要求透明，也能拿到真透明图 —— 生成时可以试试在提示词里写明「transparent background」。'
        : ' 「仅提示词」方式也不行，说明该中转输出的是不透明图，想要透明背景需要换支持的中转。';
    } else if(t2i>0 && i2i===0){
      concl='文生图支持透明，但带参考图的图生图不支持 —— 中转的 edits 路径未实现透明背景。生成时若带参考图选透明，会自动回退为不透明。';
    } else if(t2i>0 || i2i>0){
      concl='部分模型/路径支持透明背景，见上表。不支持的会自动回退为不透明背景。';
    }
    html+='<div style="margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--card2);border:1px solid var(--line);font-size:13px;line-height:1.6">'
      +'文生图 '+esc(String(t2i))+'/'+esc(String(total))+'，图生图 '+esc(String(i2i))+'/'+esc(String(total))
      +(po?'，仅提示词 '+esc(String(po))+'/'+esc(String(total)):'')+'。'
      +(concl?'<br>'+concl:'')
      +'</div>';
    el.innerHTML=html;
  }catch(e){ el.innerHTML='<div class="small-note">检测失败: '+esc(e.message)+'</div>'; }
}
function _chkRow(ok, name, detail, ms){
  var s='<div style="display:flex;gap:8px;align-items:baseline;padding:5px 0">'
    +'<span style="flex:none">'+(ok?'✅':'❌')+'</span>'
    +'<span style="flex:1;font-size:13px">'+esc(name)+'</span>'
    +(ms!=null?'<small style="flex:none;color:var(--mut)">'+ms+'ms</small>':'')+'</div>';
  if(detail) s+='<div class="small-note" style="margin:0 0 6px 22px;font-size:12px">'+esc(String(detail))+'</div>';
  return s;
}
function _secTitle(t){ return '<div style="font-size:12px;color:var(--mut);margin:10px 0 2px;font-weight:600">'+esc(t)+'</div>'; }

/* 合并诊断: ① 接口与 Key(连接测试) + ② 网络传输(网络诊断) */
async function diagnose(key){
  var el=document.getElementById('diag_'+key);
  if(!el){ toast('找不到诊断容器'); return; }
  el.classList.remove('hide');
  el.innerHTML='<div class="small-note"><span class="spin"></span>正在诊断：接口与 Key…</div>';
  var html='';
  // ① 接口与 Key
  var baseEl=document.getElementById('pbase_'+key);
  var keyEl=document.getElementById('pkey_'+key);
  var base=(baseEl&&baseEl.value||'').trim();
  var api=((keyDraft[key]||(keyEl&&keyEl.value)||'')+'').trim();
  var cm=(CONFIG[key].chat_models||[])[0], im=(CONFIG[key].image_models||[])[0];
  var model=(cm&&cm.id)||(im&&im.id)||null;
  html+=_secTitle('① 接口与 Key');
  try{
    var r=await jpost('/api/test',{provider:key,base_url:base,api_key:api||undefined,model:model||undefined});
    html+=_chkRow(!!r.ok, '接口连通 / Key 有效', r.message);
  }catch(e){
    html+=_chkRow(false, '接口连通 / Key 有效', e.message);
  }
  el.innerHTML=html+'<div class="small-note"><span class="spin"></span>正在测网络传输（大流量）…</div>';
  // ② 网络传输
  try{
    var d=await jpost('/api/netdiag',{mb:2,provider:key},300000);
    html+=_secTitle('② 网络传输（与 Key 无关，测代理/大包）');
    (d.tests||[]).forEach(function(t){ html+=_chkRow(t.ok, t.name, t.detail, t.ms); });
    if(d.advice) html+='<div style="margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--card2);border:1px solid var(--line);font-size:13px;line-height:1.6">'+esc(d.advice)+'</div>';
  }catch(e){
    html+=_secTitle('② 网络传输（与 Key 无关，测代理/大包）');
    html+=_chkRow(false, '网络测试', e.message);
  }
  el.innerHTML=html;
}
async function saveProvider(key){
  CONFIG[key].label=document.getElementById('plabel_'+key).value.trim()||key;
  CONFIG[key].base_url=document.getElementById('pbase_'+key).value.trim();
  CONFIG[key].image_models=readList(key,'image_models');
  CONFIG[key].chat_models=readList(key,'chat_models');
  const inp=document.getElementById('pkey_'+key); const v=(inp?inp.value.trim():'')||keyDraft[key]||''; if(v) keyDraft[key]=v;
  try{
    await jput('/api/config',CONFIG);
    if(v) await jpost('/api/settings',{keys:{[key]:v}});
    toast('已保存'); MODELS=await jget('/api/models'); fillProviders(); onProviderChange(); buildChatOptions();
  }catch(e){ toast('保存失败: '+e.message); } }
function readList(key,type){ const box = type==='image_models'?document.getElementById('imglist_'+key):document.getElementById('chatlist_'+key);
  if(!box) return []; const rows=box.querySelectorAll('.mrow'); const out=[];
  rows.forEach(r=>{ const id=r.querySelector('[data-id]').value.trim(); const lb=r.querySelector('[data-label]').value.trim(); if(id) out.push({id,label:lb||id}); });
  return out; }

function esc(s){ return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
document.addEventListener('click', function(e){
  if(!document.querySelector('.provmenu')) return;
  if(e.target.closest('.provmenu') || e.target.closest('.prov-menu')) return;
  closeProvMenu();
});
loadPrefs();
init();
</script>
</body>
