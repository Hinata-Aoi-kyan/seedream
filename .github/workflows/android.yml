name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'static/**'
      - 'manifest.json'
      - 'sw.js'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write             # 失败回写日志 / 成功发 Release

env:
  LOG: /tmp/build.log

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 22 (Capacitor 8 要求 >=22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # runner 镜像已预装 Android SDK，不用 setup-android(它的 sdkmanager "tools" 会失败)
      - name: 检查环境
        run: |
          set -o pipefail
          {
            echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
            SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            echo "--- 已装 platforms ---"; ls "$SDK/platforms" 2>/dev/null || true
            echo "--- 已装 build-tools ---"; ls "$SDK/build-tools" 2>/dev/null || true
            echo "--- java ---"; java -version 2>&1 | head -3
          } 2>&1 | tee -a "$LOG" >&2

      - name: 安装依赖
        run: |
          set -o pipefail
          {
            npm install --no-audit --no-fund \
              @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest \
              @capacitor/filesystem@latest @capacitor/local-notifications@latest @capacitor/app@latest \
              @capacitor-community/media@latest
            echo "--- 版本 ---"
            npx cap --version
            node -e "const p=require('./node_modules/@capacitor/android/package.json');console.log('android:',p.version)"
          } 2>&1 | tee -a "$LOG" >&2

      - name: 收集网页文件到 www/
        run: |
          set -o pipefail
          node scripts/prepare-www.mjs 2>&1 | tee -a "$LOG" >&2

      - name: 生成 Android 工程
        run: |
          set -o pipefail
          npx cap add android 2>&1 | tee -a "$LOG" >&2

      - name: 打补丁(权限/明文/应用名)
        run: |
          set -o pipefail
          node scripts/patch-android.mjs 2>&1 | tee -a "$LOG" >&2

      - name: 同步 web 资源
        run: |
          set -o pipefail
          npx cap sync android 2>&1 | tee -a "$LOG" >&2

      - name: 编译 Debug APK
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          { ./gradlew assembleDebug --no-daemon --stacktrace; } 2>&1 | tee -a /tmp/build.log

      # ---------- 成功: 发布 Release ----------
      - name: 发布 Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Seedream APK (自动构建)"
          body: |
            自动构建产物
            - commit: ${{ github.sha }}
            - 运行: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true

      # ---------- 失败: 回写日志 ----------
      - name: 回写失败日志
        if: failure()
        run: |
          python3 - <<'PY'
          import json, os
          tail = ""
          try:
              with open("/tmp/build.log", "rb") as f:
                  tail = f.read()[-9000:].decode("utf-8", "replace")
          except Exception as e:
              tail = "无法读取日志: %s" % e
          data = {
              "status": "failure",
              "sha": os.environ.get("GITHUB_SHA", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_url": "https://github.com/%s/actions/runs/%s" % (
                  os.environ.get("GITHUB_REPOSITORY", ""), os.environ.get("GITHUB_RUN_ID", "")),
              "log_tail": tail,
          }
          os.makedirs(".ci", exist_ok=True)
          with open(".ci/status.json", "w") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print("已写入 .ci/status.json, 日志 %d 字符" % len(tail))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .ci/status.json
          git commit -m "ci: build failure [skip ci]" || true
          git push || true
